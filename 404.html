<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page Not Found</title>
  <style>
    :root {
      --primary: #6366f1;
      --primary-hover: #4f46e5;
      --bg-start: #0f172a;
      --bg-end: #1e1b4b;
      --text-main: #f8fafc;
      --text-sub: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, var(--bg-start), var(--bg-end));
      color: var(--text-main);
      overflow: hidden;
      position: relative;
    }

    /* Animated background glow elements */
    .glow {
      position: absolute;
      border-radius: 50%;
      filter: blur(80px);
      opacity: 0.4;
      animation: pulse 8s infinite alternate ease-in-out;
    }

    .glow-1 {
      width: 300px;
      height: 300px;
      background: #818cf8;
      top: -50px;
      left: -50px;
    }

    .glow-2 {
      width: 400px;
      height: 400px;
      background: #c084fc;
      bottom: -100px;
      right: -100px;
      animation-delay: -4s;
    }

    @keyframes pulse {
      0% { transform: scale(1) translate(0, 0); }
      100% { transform: scale(1.2) translate(30px, 30px); }
    }

    /* Glassmorphism Card Container */
    .card {
      position: relative;
      z-index: 10;
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 24px;
      padding: 3rem 2.5rem;
      max-width: 480px;
      width: 90%;
      text-align: center;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
    }

    /* SVG Illustration Styling */
    .illustration {
      width: 140px;
      height: 140px;
      margin: 0 auto 1.5rem;
      display: block;
      animation: float 4s infinite ease-in-out;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }

    .error-code {
      font-size: 5rem;
      font-weight: 800;
      line-height: 1;
      background: linear-gradient(135deg, #a5b4fc, #e0e7ff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 0.5rem;
      letter-spacing: -2px;
    }

    h1 {
      font-size: 1.5rem;
      font-weight: 600;
      margin-bottom: 0.75rem;
    }

    p {
      color: var(--text-sub);
      font-size: 1rem;
      line-height: 1.6;
      margin-bottom: 2rem;
    }

    /* Button Styling */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      background-color: var(--primary);
      color: #ffffff;
      padding: 0.85rem 1.75rem;
      border-radius: 12px;
      font-weight: 600;
      font-size: 0.95rem;
      text-decoration: none;
      transition: all 0.25s ease;
      box-shadow: 0 4px 14px 0 rgba(99, 102, 241, 0.39);
    }

    .btn:hover {
      background-color: var(--primary-hover);
      transform: translateY(-2px);
      box-shadow: 0 6px 20px 0 rgba(99, 102, 241, 0.5);
    }

    .btn svg {
      width: 18px;
      height: 18px;
      transition: transform 0.25s ease;
    }

    .btn:hover svg {
      transform: translateX(-4px);
    }
  </style>
</head>
<body>

  <!-- Background Animated Lights -->
  <div class="glow glow-1"></div>
  <div class="glow glow-2"></div>

  <!-- 404 Glass Card -->
  <div class="card">
    <!-- Floating Space/Planet SVG Icon -->
    <svg class="illustration" viewBox="0 0 24 24" fill="none" stroke="#a5b4fc" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="9"/>
      <path d="M3.6 9h16.8"/>
      <path d="M3.6 15h16.8"/>
      <path d="M11.5 3a17 17 0 0 0 0 18"/>
      <path d="M12.5 3a17 17 0 0 1 0 18"/>
    </svg>

    <div class="error-code">404</div>
    <h1>Lost in Space?</h1>
    <p>The page you are looking for doesn't exist, has been removed, or is temporarily unavailable.</p>

    <a href="/" class="btn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M19 12H5M12 19l-7-7 7-7"/>
      </svg>
      Back to Home
    </a>
  </div>

</body>
</html>
