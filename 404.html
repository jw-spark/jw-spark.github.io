<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page Not Found</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #000;
      color: #00ff66;
      font-family: 'Courier New', Courier, monospace;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }

    /* Canvas for the Matrix digital rain */
    canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 2;
      opacity: 0.55;
    }

    /* Terminal Box styling */
    .terminal {
      position: relative;
      z-index: 2;
      background: rgba(0, 15, 0, 0.85);
      border: 1px solid #00ff66;
      box-shadow: 0 0 25px rgba(0, 255, 102, 0.3), inset 0 0 15px rgba(0, 255, 102, 0.2);
      padding: 2.5rem 2rem;
      max-width: 520px;
      width: 90%;
      border-radius: 4px;
    }

    .error-code {
      font-size: 5rem;
      font-weight: bold;
      line-height: 1;
      text-shadow: 0 0 10px #00ff66, 0 0 20px #00ff66;
      margin-bottom: 1rem;
      letter-spacing: -2px;
    }

    h1 {
      font-size: 1.25rem;
      text-transform: uppercase;
      letter-spacing: 2px;
      margin-bottom: 1rem;
      color: #adff2f;
      text-shadow: 0 0 5px #adff2f;
    }

    p {
      font-size: 0.95rem;
      line-height: 1.6;
      margin-bottom: 1.75rem;
      color: #00cc55;
    }

    .prompt {
      color: #00ff66;
      font-weight: bold;
    }

    /* Terminal Action Button */
    .btn {
      display: inline-block;
      background: transparent;
      color: #00ff66;
      border: 1px solid #00ff66;
      padding: 0.75rem 1.5rem;
      font-family: 'Courier New', Courier, monospace;
      font-size: 0.95rem;
      font-weight: bold;
      text-decoration: none;
      text-transform: uppercase;
      letter-spacing: 1px;
      transition: all 0.2s ease;
      box-shadow: 0 0 5px rgba(0, 255, 102, 0.2);
    }

    .btn:hover {
      background-color: #00ff66;
      color: #000;
      box-shadow: 0 0 15px #00ff66;
    }

    /* CRT Scanline overlay effect */
    .scanlines {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      background: linear-gradient(
        rgba(18, 16, 16, 0) 50%, 
        rgba(0, 0, 0, 0.25) 50%
      );
      background-size: 100% 4px;
      z-index: 3;
    }
  </style>
</head>
<body>

  <!-- Matrix Rain Canvas Background -->
  <canvas id="matrixCanvas"></canvas>

  <!-- CRT Screen lines overlay -->
  <div class="scanlines"></div>

  <!-- Main Terminal Box -->
  <div class="terminal">
    <div class="error-code">ERROR</div>
    <h1>[ Page Not Found ]</h1>
    <p>
      <span class="prompt">&gt;</span> The requested address does not exist in the mainframe or has been disconnected from the network.
    </p>
    <a href="/" class="btn">&gt; Reconnect to Root</a>
  </div>

  <script>
    const canvas = document.getElementById('matrixCanvas');
    const ctx = canvas.getContext('2d');

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    resizeCanvas();
    window.addEventListener('resize', resizeCanvas);

    // Characters for the digital rain (Japanese katakana + numbers + letters)
    const chars = 'ﾊﾐﾋｰｳｼﾅﾓﾆｻﾜﾂｵﾘｱﾎﾃﾏｹﾒｴｶｷﾑﾕﾗｾﾈｽﾀﾇﾍ0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ';
    const fontSize = 16;
    let columns = Math.floor(canvas.width / fontSize);
    let drops = [];

    for (let i = 0; i < columns; i++) {
      drops[i] = 1;
    }

    function draw() {
      ctx.fillStyle = 'rgba(0, 0, 0, 0.05)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.fillStyle = '#00ff66';
      ctx.font = fontSize + 'px monospace';

      for (let i = 0; i < drops.length; i++) {
        const text = chars.charAt(Math.floor(Math.random() * chars.length));
        ctx.fillText(text, i * fontSize, drops[i] * fontSize);

        if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) {
          drops[i] = 0;
        }
        drops[i]++;
      }
    }

    setInterval(draw, 33);
  </script>

</body>
</html>
