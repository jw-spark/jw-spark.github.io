<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover"
>
<title>Bus Arrival Predictor - By Day &amp; Hour</title>

<style>
* {
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    background: #111;
    color: #fff;
    padding: 20px;
    margin: 0;
}

h2,
h3 {
    margin-top: 0;
}

code {
    color: #b9ffd1;
}

.section {
    margin-bottom: 24px;
}

.card {
    background: #1c1c1c;
    border: 1px solid #2e2e2e;
    border-radius: 10px;
    padding: 12px;
    margin: 8px 0;
}

.bus-no {
    font-size: 20px;
    font-weight: bold;
}

.badge {
    display: inline-block;
    padding: 3px 8px;
    border-radius: 999px;
    font-size: 12px;
    margin-right: 6px;
    margin-top: 6px;
    border: 1px solid rgba(255, 255, 255, 0.15);
}

.good {
    color: #7cfc98;
}

.warn {
    color: #ffd966;
}

.bad {
    color: #ff7b7b;
}

.normal-badge {
    background: rgba(124, 252, 152, 0.1);
    color: #b9ffd1;
    border-color: rgba(124, 252, 152, 0.25);
}

.low-data-badge {
    background: rgba(255, 217, 102, 0.1);
    color: #ffe9a8;
    border-color: rgba(255, 217, 102, 0.25);
}

.grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
    gap: 12px;
}

.small {
    color: #bbb;
    font-size: 13px;
}

pre {
    background: #0d0d0d;
    border: 1px solid #2e2e2e;
    border-radius: 8px;
    padding: 10px;
    max-height: 260px;
    overflow: auto;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
}

.kv {
    margin-top: 8px;
    line-height: 1.6;
}

.kv b {
    display: inline-block;
    min-width: 170px;
}

.divider {
    margin: 8px 0;
    border-top: 1px solid #2e2e2e;
}

.controls {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    align-items: flex-end;
    background: #1c1c1c;
    border: 1px solid #2e2e2e;
    border-radius: 10px;
    padding: 16px;
}

.field {
    display: flex;
    flex-direction: column;
    gap: 4px;
}

.field label {
    font-size: 12px;
    color: #bbb;
}
