<script>
// flag:true = question shown with red background in the source screenshots
const Q = [
{q:"An organization is launching a responsible artificial intelligence (RAI) program to enhance trust in its artificial intelligence (AI) systems. Which is the <b>MOST</b> effective first action to take?",
 o:["Assign AI governance decisions to the organization’s IT operations manager.","Focus RAI efforts exclusively on model retraining intervals and tuning.","Establish leadership support to set the tone for responsible ethical AI use.","Delay RAI efforts until the next budget cycle to ensure full resourcing."],
 a:2,
 j:["Concentrating artificial intelligence (AI) governance in IT operations lacks cross-functional oversight and strategic influence.","Model tuning is important but operational; it cannot replace leadership-driven principles of ethical AI use.","Responsible artificial intelligence (RAI) programs require active support from leadership to model ethical values, build trust, and ensure organizationwide adoption. Leadership sets expectations and direction for long-term accountability.","Delaying RAI efforts increases risk exposure and undermines trust-building efforts."],
 d:"1 – AI Governance and Program Management",k:"1B – AI-related Strategies, Policies, and Procedures",t:"2 – Establish and maintain AI-specific security policies and procedures to inform the development and implementation of AI standards and guidelines"},

{q:"Which is the <b>BIGGEST</b> challenge in artificial intelligence (AI) model training?",
 o:["Limiting the model’s exposure to diverse datasets","Ensuring data privacy and security during model training","Removing data biases to accelerate model training","Allowing the model to operate without human supervision"],
 a:1,
 j:["Diverse datasets are essential for building robust and accurate artificial intelligence (AI) models. Limiting exposure can lead to biased or ineffective models.","Ensuring data privacy and security is crucial during model training, especially when the model is handling sensitive information.","Removing data biases is a significant issue that can result in unfair, biased, or inaccurate AI systems, but it is not as important as ensuring the privacy and security of the training data.","Human supervision is critical in AI training to ensure the model aligns with ethical guidelines and produces fair outcomes."],
 d:"1 – AI Governance and Program Management",k:"1A – Stakeholder considerations, Industry Frameworks, and Regulatory Requirements",t:"1 – Collaborate on charter, roles, and responsibilities for governance and management of AI to align with business objectives"},

{q:"Which is a critical component to include in artificial intelligence (AI) solution procedures?",
 o:["Ensuring human oversight and validation","Selecting popular open-source algorithms","Limiting documentation to reduce complexity","Avoiding transparency to protect intellectual property (IP)"],
 a:0,
 j:["Human oversight is vital in ensuring that artificial intelligence (AI) decisions are ethically sound and that any potential biases or errors can be addressed before deployment. Therefore, human oversight should be part of any procedure related to the use of AI solutions.","Popular open-source algorithms might not always meet the organization’s specific needs or security standards.","Adequate documentation is necessary for transparency and accountability in AI deployment, especially when complex decisions are involved.","Transparency builds trust and allows for better understanding, debugging, and monitoring of AI solutions."],
 d:"1 – AI Governance and Program Management",k:"1A – Stakeholder considerations, Industry Frameworks, and Regulatory Requirements",t:"1 – Collaborate on charter, roles, and responsibilities for governance and management of AI to align with business objectives"},

{q:"An enterprise has implemented an artificial intelligence (AI) acceptable use policy (AUP), but policy violations have started to occur. Which is the <b>MOST</b> effective control to enforce compliance and reduce future violations?",
 o:["Rely on user training and trust that employees will follow the AUP guidelines.","Define clear investigation procedures and disciplinary consequences for AI policy breaches.","Immediately revoke system access for any user who violates the AUP.","Record only those policy violations that result in legal or reputational damage."],
 a:1,
 j:["Training is critical but not sufficient alone without defined consequences for noncompliance.","Clearly defined enforcement processes, including investigation protocols and disciplinary actions, are essential to promote accountability and reduce misuse. Enforcement supports the credibility and effectiveness of artificial intelligence (AI) policies.","Revocation without investigation may violate due process and create disproportionate outcomes.","Ignoring violations undermines governance efforts and increases risk over time."],
 d:"1 – AI Governance and Program Management",k:"1B – AI-related Strategies, Policies, and Procedures",t:"2 – Establish and maintain AI-specific security policies and procedures to inform the development and implementation of AI standards and guidelines"},

{q:"An enterprise introduced its artificial intelligence (AI) policy last year and has since expanded its use of generative artificial intelligence (GenAI) tools. What is the <b>MOST</b> important reason to review and update the policy?",
 o:["New employees have been hired since the policy was adopted.","Most employees have not read the acceptable use policy (AUP).","Regulatory and technological environments evolve rapidly.","The AI system has not experienced a major incident since deployment."],
 a:2,
 j:["Staffing changes are not a primary trigger for policy review.","Low awareness should prompt training, not policy revision.","Artificial intelligence (AI) policies should be reviewed periodically to remain relevant amid changing laws, risk factors, and AI capabilities. Failure to do so may result in compliance gaps and misaligned usage practices.","The absence of incidents does not eliminate the need for proactive policy maintenance."],
 d:"1 – AI Governance and Program Management",k:"1B – AI-related Strategies, Policies, and Procedures",t:"2 – Establish and maintain AI-specific security policies and procedures to inform the development and implementation of AI standards and guidelines"},

{q:"An organization intends to implement an artificial intelligence (AI) solution to detect financial fraud. Which should be the <b>FIRST</b> action taken?",
 o:["Identify the business challenges, stakeholder needs, and solution requirements.","Design the structure for monitoring and reporting on unexpected outputs.","Gather available datasets for cleaning, transformation, and training.","Research available pretrained AI solutions that best fit the organization’s needs."],
 a:0,
 j:["The first step to deploying an artificial intelligence (AI) solution involves determining the business problem the AI solution should solve, the goals it must achieve, and the requirements needed within its life cycle. This first step guides the remainder of the AI life cycle, ensuring the AI solution can successfully support the organization’s mission while abiding by legal, regulatory, and ethical requirements.","The structure for monitoring and reporting on an AI solution cannot be created without understanding what metrics, requirements, and outputs stakeholders deem important.","Gathering data without first understanding the type of data that is needed to train the model will lead to inefficiencies and potential failure to accomplish business objectives.","By not first identifying the business problem, stakeholder needs, and solution requirements, research can be misguided and driven by solution features instead of ability to complete business objectives."],
 d:"1 – AI Governance and Program Management",k:"1B – AI-related Strategies, Policies, and Procedures",t:"22 – Advise on security risk and controls related to the AI solution development life cycle within an organization"},

{q:"A company deploying an artificial intelligence (AI) system for hiring discovers that its model disproportionately rejects candidates from a certain demographic group. What is the <b>BEST</b> approach to ensure compliance with local laws and regulations?",
 o:["Conduct systematic bias detection and impact assessments while training the AI system.","Limit the dataset to objective attributes to avoid the need for any fairness interventions.","Train the model using only anonymized data to prevent demographic bias.","Remove all demographic features and assume equal treatment across groups."],
 a:0,
 j:["Conducting systematic bias detection ensures that the artificial intelligence (AI) model is evaluated for disparate impact across demographic groups and allows for proactive remediation aligned with legal and ethical obligations (e.g., General Data Protection Regulation [GDPR], EU AI Act, Equal Employment Opportunity Commission [EEOC] guidelines). Bias assessments should be ongoing, not one-time tasks.","While limiting data to objective attributes may seem neutral, fairness-aware interventions are still needed. Historical or structural bias may persist in objective data like employment history or education, and avoiding fairness methods fails to mitigate systemic discrimination.","Anonymization helps preserve privacy but does not ensure fairness. Without demographic information during training or validation, it is impossible to detect or mitigate disparate impacts, which is essential for legal compliance.","Removing demographic features does not eliminate bias. This practice, known as “fairness through unawareness,” ignores proxy variables that can still encode and reproduce demographic disparities, making the model’s outcomes potentially discriminatory."],
 d:"1 – AI Governance and Program Management",k:"1A – Stakeholder considerations, Industry Frameworks, and Regulatory Requirements",t:"3 – Ensure the responsible use of AI by utilizing leading practices, ethical principles, regulatory requirements, and industry frameworks"},

{flag:true,
 q:"A large multinational corporation is using artificial intelligence (AI) to screen job applications and identify potential candidates. What is the <b>PRIMARY</b> purpose of ensuring the explainability of this AI system in this scenario?",
 o:["To improve hiring practices over time","To promote transparency in hiring decisions","To support legal and regulatory compliance","To support auditability of the AI solution"],
 a:1,
 j:["Clear insights into how decisions are made help human resources teams refine model criteria by identifying and correcting problematic patterns in candidate selection.","Explainability ensures artificial intelligence (AI) decision-making processes are transparent, which is critical for hiring managers to understand why someone was selected or rejected.","Demonstrating explainability helps meet regulatory antidiscrimination and data protection laws; however, the primary purpose of ensuring explainability is to ensure that AI decisions are transparent and well understood.","Explainable systems provide clear documentation and reasoning for each decision, which is essential for audits or investigations."],
 d:"1 – AI Governance and Program Management",k:"1A – Stakeholder considerations, Industry Frameworks, and Regulatory Requirements",t:"8 – Conduct AI impact assessments and ensure conformity with regulatory requirements"},

{q:"Which type of bias is present in artificial intelligence (AI) datasets, organizational practices, and processes across the AI life cycle?",
 o:["Systemic","Computational","Statistical","Human-cognitive"],
 a:0,
 j:["Systemic bias can be present in artificial intelligence (AI) datasets, the organizational norms, practices, and processes across the entire AI life cycle.","Computational biases can be presented in AI datasets and algorithmic processes.","Statistical biases can be presented in AI datasets and algorithmic processes.","Human-cognitive bias coexists with the human factor; thus, not in datasets."],
 d:"1 – AI Governance and Program Management",k:"1B – AI-related Strategies, Policies, and Procedures",t:"3 – Ensure the responsible use of AI by utilizing leading practices, ethical principles, regulatory requirements, and industry frameworks"},

{q:"Which of the following <b>BEST</b> ensures accountability and ethical oversight across different artificial intelligence (AI) initiatives in an enterprise?",
 o:["Outsource AI governance responsibilities to a third party with AI expertise.","Require that all employees complete ethics training on AI risk.","Automate all AI oversight functions through technical monitoring tools.","Define a governance framework for AI use."],
 a:3,
 j:["While vendors may assist in developing artificial intelligence (AI) and AI governance frameworks, outsourcing responsibility undermines internal accountability structures.","Training is important but does not define accountability or enforce ethical oversight mechanisms and is insufficient by itself.","Automated tools may support monitoring but cannot replace organizational accountability structures. They also require monitoring themselves to guard against cyberattacks or incorrect results.","A formal governance framework ensures accountability by assigning clear roles for decision making, policy management, and oversight, promoting responsible and ethical AI use throughout the enterprise."],
 d:"1 – AI Governance and Program Management",k:"1A – Stakeholder considerations, Industry Frameworks, and Regulatory Requirements",t:"3 – Ensure the responsible use of AI by utilizing leading practices, ethical principles, regulatory requirements, and industry frameworks"},

{q:"An enterprise has introduced a generative artificial intelligence (GenAI) assistant to support employees in automating content creation and summarizing internal documents. Which action should be taken <b>FIRST</b> to ensure responsible use of the GenAI assistant?",
 o:["Require all employees to agree and sign service terms during login.","Enable continuous monitoring of queries for inappropriate use.","Provide targeted training to employees, including an acceptable use policy (AUP).","Send regular awareness emails about GenAI risk and compliance topics."],
 a:2,
 j:["While acknowledgment of the service terms is necessary, signing a policy without prior awareness and training limits its effectiveness and may not ensure informed compliance.","Monitoring is a detective control and does not proactively establish understanding.","Training employees before they accept the artificial intelligence (AI) acceptable use policy (AUP) ensures they understand the scope of authorized use, data sensitivity, and behavioral expectations, reducing misuse and aligning with ethical AI use.","General awareness is helpful but not sufficient to enforce policies specific to generative artificial intelligence (GenAI) tools."],
 d:"1 – AI Governance and Program Management",k:"1B – AI-related Strategies, Policies, and Procedures",t:"21 – Develop and maintain AI-specific security awareness training and acceptable use guidelines"},

{flag:true,
 q:"What is the <b>BEST</b> action to improve transparency and auditability of an artificial intelligence (AI) system’s outputs?",
 o:["Integrate user activity monitoring to track staff interactions.","Allow users full access to the system’s model outputs.","Implement controls aligned to rationale, data, and impact.","Grant AI governance personnel permission to share model access."],
 a:2,
 j:["User activity monitoring supports security but does not directly explain or justify model outputs.","Allowing users full access to model outputs may improve transparency but not explainability.","Controls aligned to rationale, data, and impact enhance transparency by providing clear, structured explanations for artificial intelligence (AI) outputs. Aligning controls to dimensions like rationale, data, and impact ensures decisions can be traced, audited, and understood, supporting trust and accountability.","AI governance personnel may have more discretion than average users, but providing full access to users may jeopardize trade secrets."],
 d:"1 – AI Governance and Program Management",k:"1A – Stakeholder considerations, Industry Frameworks, and Regulatory Requirements",t:"3 – Ensure the responsible use of AI by utilizing leading practices, ethical principles, regulatory requirements, and industry frameworks"},

{q:"A <b>KEY</b> factor in artificial intelligence (AI) data life cycle management is:",
 o:["creating retention policies for model training data.","implementing data access policies based on model updates.","defining data retention schedules based on data sensitivity.","allowing automatic data deletion after a predefined retention period."],
 a:0,
 j:["Retention policies are an essential factor in artificial intelligence (AI) data life cycle management to ensure the appropriate duration of data storage based on both legal and business needs. These policies guide when data should be retained, archived, or deleted, ensuring compliance, minimizing security risk, and supporting data governance.","While access policies based on model updates are important for controlling who can modify or use the models, they do not directly address the need for managing how long the training data is retained or when it should be discarded.","Data sensitivity is important when classifying data, but defining retention schedules based solely on sensitivity does not fully account for other factors, like legal compliance or model-specific needs, which should be part of a comprehensive retention policy.","Allowing automatic data deletion after a set period may sound efficient, but it risks losing valuable data required for further analysis, audits, or model improvement. Data deletion should be managed with careful consideration to ensure it does not impair model development or compliance."],
 d:"1 – AI Governance and Program Management",k:"1B – AI-related Strategies, Policies, and Procedures",t:"13 – Establish and maintain processes to identify, inventory, and classify data and assets related to AI"},

{q:"What is the <b>BEST</b> approach for a global enterprise to ensure legal and ethical alignment with artificial intelligence (AI) regulations across jurisdictions?",
 o:["Delay deployment of AI solutions until global regulatory convergence is achieved.","Map applicable regional and international regulations to internal governance policies based on geographical presence.","Focus on regional jurisdictions for all privacy and data governance controls.","Limit deployment of AI to internal-only systems to avoid regulatory complications."],
 a:1,
 j:["Waiting for global regulatory alignment is impractical and delays innovation.","Mapping artificial intelligence (AI) laws (such as the EU AI Act and other regional frameworks) to internal policies helps ensure compliance, ethical alignment, and readiness for audits across jurisdictions.","Focusing on regional laws and regulations is important for local offices, but not sufficient for complete AI governance. It also fails to account for overlap between jurisdictions in a global enterprise.","Limiting the deployment of AI can negatively impact business growth and does not solve governance maturity challenges. It does not solve the problem of compliance with multiple jurisdictions in a global enterprise."],
 d:"1 – AI Governance and Program Management",k:"1A – Stakeholder considerations, Industry Frameworks, and Regulatory Requirements",t:"3 – Ensure the responsible use of AI by utilizing leading practices, ethical principles, regulatory requirements, and industry frameworks"},

{flag:true,
 q:"An enterprise is planning to implement an artificial intelligence (AI) chatbot that uses a vector database and retrieval-augmented generation (RAG) to output demographic data. Under most AI shared responsibility models, which would give the enterprise the <b>MOST</b> control over its data and model?",
 o:["Platform as a service (PaaS)","Infrastructure as a service (IaaS)","Software as a service (SaaS)","Function as a service (FaaS)"],
 a:1,
 j:["A platform as a service (PaaS) solution generally allows customers to select and configure certain parameters and models from a preselected pool.","Infrastructure as a service (IaaS) provides the most control over the underlying infrastructure of an artificial intelligence (AI) solution. This type of offering will generally allow users to control the data used to train the model, the data that is outputted, manipulate the model to meet the desired requirements, and implement security/safety controls.","Under the software as a service (SaaS) shared responsibility model, the model, parameters, and certain data handling functions are mostly managed by the AI provider.","Like SaaS, under the function as a service (FaaS) shared responsibility model, the model, parameters, and certain data handling functions are mostly managed by the AI provider."],
 d:"1 – AI Governance and Program Management",k:"1B – AI-related Strategies, Policies, and Procedures",t:"9 – Embed, monitor, and verify AI security requirements when utilizing vendor AI-enabled solutions"},

{q:"Which is a <b>KEY</b> regulatory requirement for securing artificial intelligence (AI) systems?",
 o:["Ensuring AI decision making is explainable and auditable","Using only approved AI models to make business decisions","Using only open-source AI models to ensure consistency of decisions","Applying the same level of control to all AI solutions"],
 a:0,
 j:["Regulations require artificial intelligence (AI) systems to be explainable and auditable to ensure security and accountability. This not only takes into account internal considerations, but also considers the human impact of using AI solutions.","Most regulations do not specify a list of AI models that can be used by enterprises in AI solutions, but they can limit the situations in which AI solutions are labeled as high risk.","Open-source AI models require specific security controls but using them is not a regulatory requirement.","Like other IT assets, controls should be determined using a risk-based approach, ensuring that the proper level of control is applied based on the impact of realized risk and enterprise risk appetite and tolerance."],
 d:"1 – AI Governance and Program Management",k:"1A – Stakeholder considerations, Industry Frameworks, and Regulatory Requirements",t:"1 – Collaborate on charter, roles, and responsibilities for governance and management of AI to align with business objectives"},

{flag:true,
 q:"A financial institution is about to launch an artificial intelligence (AI)-powered fraud detection system but has not documented how it makes decisions. What is the <b>PRIMARY</b> reason AI governance policies are needed before launch?",
 o:["Regulatory compliance","Operational risk","Preparedness for audits","Customer trust and confidence"],
 a:0,
 j:["Financial institutions operate under strict regulatory frameworks that require explainable decision-making processes, especially for artificial intelligence (AI) systems that impact customer accounts or trigger fraud alerts. Without proper governance documentation, the institution risks significant regulatory penalties.","Financial institutions should implement proactive governance and monitoring of AI systems to prevent operational disruptions.","Governance ensures that all decisions, data sources, and model parameters are documented, making it easier to comply with audits.","Governance helps build transparency and trust in AI decisions, as customers expect understandable reasons for blocked transactions or flagged accounts."],
 d:"1 – AI Governance and Program Management",k:"1A – Stakeholder considerations, Industry Frameworks, and Regulatory Requirements",t:"1 – Collaborate on charter, roles, and responsibilities for governance and management of AI to align with business objectives"},

{q:"A highly regulated organization is looking to expand its use of artificial intelligence (AI) across sensitive and critical business functions. Which <b>BEST</b> ensures that this AI initiative is aligned with business goals and ethical standards?",
 o:["Implement an AI steering committee.","Identify inefficiencies that could be addressed by AI.","Monitor AI system and process metrics.","Encourage reporting on issues with AI systems."],
 a:0,
 j:["A steering committee is a group of stakeholders who are accountable for ensuring programs and projects advance business goals, while meeting regulatory requirements and addressing ethical concerns about the impact of the artificial intelligence (AI) use on humans.","While a goal of AI could be to address inefficiencies, an AI steering committee would ensure that the use of AI to correct these issues would be in alignment with the overall goals of the business.","Monitoring the AI system to ensure that it is meeting specified performance levels is key to ensuring the AI solution delivers value. However, metrics alone would not ensure that expansion of AI systems would align with business objectives and ensure ethical standards are met.","The steering committee does not directly receive reports from users. Potential issues are reported to staff designated by system or process owners to investigate before being reported to the committee."],
 d:"1 – AI Governance and Program Management",k:"1A – Stakeholder considerations, Industry Frameworks, and Regulatory Requirements",t:"3 – Ensure the responsible use of AI by utilizing leading practices, ethical principles, regulatory requirements, and industry frameworks"},

{flag:true,
 q:"What is a <b>KEY</b> consideration when establishing procedures for data privacy in artificial intelligence solutions (AISs)?",
 o:["Ensuring only a minimal amount of data is collected","Using data from any source without restrictions","Focusing on the maximum usage of personal data for model training","Securing consent from users and maintaining data confidentiality"],
 a:3,
 j:["Minimizing data collection is important, but the focus should be on obtaining consent and protecting privacy.","Data sources should be vetted to ensure compliance with privacy regulations and ethical standards.","Overusing personal data can breach privacy laws and erode trust in the artificial intelligence solution (AIS).","Ensuring informed consent and maintaining data confidentiality is critical to upholding privacy rights and meeting regulatory standards."],
 d:"1 – AI Governance and Program Management",k:"1B – AI-related Strategies, Policies, and Procedures",t:"1 – Collaborate on charter, roles, and responsibilities for governance and management of AI to align with business objectives"},

{flag:true,
 q:"The <b>MOST</b> critical component in an artificial intelligence (AI) framework to ensure security of the system is:",
 o:["secure data handling and model integrity verification.","the accuracy of AI model predictions.","use of high-quality proprietary data.","automated processes that require human oversight."],
 a:0,
 j:["Secure data and verified model integrity are essential for artificial intelligence (AI) security, as they ensure that the model and its associated datasets have not been tampered with, which can result in biased or harmful outputs.","Accuracy may be an indication that the model has not been tampered with, but this does not ensure the security of an AI system. Speed is important, but not at the cost of security.","While using proprietary datasets can provide assurances that the data quality meets the organization’s requirements, it does not guarantee the datasets cannot be subject to tampering.","While automating processes that require human oversight can improve consistency and performance, it removes human judgment that may be essential to interpreting important context or risk."],
 d:"1 – AI Governance and Program Management",k:"1A – Stakeholder considerations, Industry Frameworks, and Regulatory Requirements",t:"11 – Advise on the integration of AI architecture as part of enterprise architecture"}

,
{flag:true,
 q:"An enterprise is evaluating whether to build an internal artificial intelligence (AI) recommendation engine or procure a commercial solution. What is the <b>MOST</b> important factor to consider when making this decision?",
 o:["Availability of trending toolkits","Strategic alignment with business needs","Ability to match competitors’ deployment timelines","Budget availability to initiate procurement"],
 a:1,
 j:["The availability of artificial intelligence solution (AIS) toolkits is a technical consideration and does not address business alignment. It is important, but not the most important for ensuring long-term growth.","A strategic fit with the needs of the enterprise is critical to determining the long-term viability and appropriateness of either building or buying an AIS.","Competitive timing is a business consideration, but it should not override due diligence and governance.","Budget availability supports execution but does not address whether the solution aligns with enterprise goals or delivers value."],
 d:"1 – AI Governance and Program Management",k:"1B – AI-related Strategies, Policies, and Procedures",t:"3 – Ensure the responsible use of AI by utilizing leading practices, ethical principles, regulatory requirements, and industry frameworks"},

{q:"An enterprise is developing its first artificial intelligence (AI) acceptable use policy (AUP) to support the internal use of generative AI (GenAI) tools. Which is the <b>MOST</b> important component to include in the AI AUP for end users?",
 o:["Define how the policy supports strategic enterprise objectives.","Specify categories of permitted and restricted AI use cases.","Reference applicable internal policies and AI risk management frameworks.","Document procedures for evaluating compliance and handling violations."],
 a:1,
 j:["Strategic alignment is the foundation of an effective artificial intelligence (AI) acceptable use policy (AUP), but not for end users.","Use case restrictions ensure the policy supports organizational objectives, the enterprise improves adoption, accountability, and alignment with long-term goals for end users.","Referencing other policies improves consistency but does not define the purpose or enforceability of the AI AUP.","Procedures for compliance and violations are part of enforcement; they follow after core policy intent and scope are established."],
 d:"1 – AI Governance and Program Management",k:"1B – AI-related Strategies, Policies, and Procedures",t:"2 – Establish and maintain AI-specific security policies and procedures to inform the development and implementation of AI standards and guidelines"},

{q:"Which <b>BEST</b> helps to reduce algorithmic bias and discrimination?",
 o:["Ensure audits are conducted on decision tools.","Ensure data is cleansed properly during the preprocessing stage.","Ensure test plans include edge cases to address potential bias.","Ensure test plans include unit and integration testing to address potential bias."],
 a:0,
 j:["Ensuring audits on decision tools are conducted is a recommended method to reduce algorithmic bias and discrimination.","Ensuring data is cleansed properly during the preprocessing stage does not reduce algorithmic bias and discrimination because data cleansing aims to remove errors and inconsistencies instead of addressing the bias.","Ensuring that test plans include edge cases to address potential bias can assist in identifying instances of bias but does not sufficiently cover all forms of bias and discrimination.","Unit and integration testing focuses on functionality and integration testing and not algorithmic bias and discrimination."],
 d:"1 – AI Governance and Program Management",k:"1B – AI-related Strategies, Policies, and Procedures",t:"3 – Ensure the responsible use of AI by utilizing leading practices, ethical principles, regulatory requirements, and industry frameworks"},

{q:"An enterprise is operationalizing its artificial intelligence (AI) governance framework and needs to develop procedures to support secure and reliable AI outcomes. The <b>BEST</b> reason to document AI-specific procedures is to:",
 o:["ensure consistency in AI data processing to reduce risk of unintended model behavior.","enforce a strict approval hierarchy for all business data access requests.","allow AI engineers to work independently without business interference.","automate all aspects of AI development without requiring human review."],
 a:0,
 j:["Documented artificial intelligence (AI)-specific procedures help ensure consistency, reduce error rates, and promote trust in model behavior by outlining how AI systems should be developed, deployed, and monitored.","Approval hierarchies are important but represent only one small part of a procedure’s scope and do not address AI-specific processing needs.","Isolation of AI development from business oversight contradicts governance and explainability standards.","Full automation without human involvement violates responsible AI practices and increases risk."],

const L = ["A","B","C","D"];
let order=[], idx=0, answered={}, picked=null, score=0;
const $=id=>document.getElementById(id);
const store = JSON.parse(localStorage.getItem("aiGovMissed")||"[]");

function build(){
  order = Q.map((_,i)=>i);
  if($("flaggedOnly").checked) order = order.filter(i=>Q[i].flag);
  if($("shuffle").checked) order.sort(()=>Math.random()-.5);
  idx=0; answered={}; score=0; picked=null;
  $("result").classList.add("hidden"); $("quiz").classList.remove("hidden"); $("nav").classList.remove("hidden");
  render();
}

function render(){
  const i = order[idx], q = Q[i], done = answered[i]!==undefined;
  picked = done ? answered[i] : null;
  let h = `<div class="card"><div class="q">${q.q}${q.flag?'<span class="badge">flagged</span>':''}</div><div class="opts">`;
  q.o.forEach((t,n)=>{
    let c="opt";
    if(done){ c+=" locked"; if(n===q.a) c+=" correct"; else if(n===answered[i]) c+=" wrong"; }
    h+=`<div class="${c}" data-n="${n}"><span class="k">${L[n]}.</span><span>${t}</span></div>`;
  });
  h+=`</div><div class="ans ${done&&answered[i]!==q.a?'bad':''} ${done?'show':''}">
    <b>${L[q.a]} is the correct answer.</b><h3>Justification</h3><div class="just">`;
  q.j.forEach((t,n)=>h+=`<div class="${n===q.a?'hit':''}">${L[n]}. ${t}</div>`);
  h+=`</div><div class="meta"><b>Domain</b>${q.d}<b>Knowledge Statement</b>${q.k}<b>Task Statement</b>${q.t}</div></div></div>`;
  $("quiz").innerHTML=h;
  document.querySelectorAll(".opt").forEach(el=>el.onclick=()=>{
    if(answered[i]!==undefined) return;
    picked=+el.dataset.n;
    document.querySelectorAll(".opt").forEach(o=>o.classList.remove("selected"));
    el.classList.add("selected"); $("check").disabled=false;
  });
  $("check").disabled = done || picked===null;
  $("prev").disabled = idx===0;
  $("next").textContent = idx===order.length-1 ? "Finish" : "Next →";
  $("counter").textContent=`Q${idx+1}/${order.length}`;
  $("pbar").style.width=(Object.keys(answered).length/order.length*100)+"%";
  $("score").textContent=`Score: ${score}/${Object.keys(answered).length}`;
}

$("check").onclick=()=>{
  const i=order[idx]; if(picked===null||answered[i]!==undefined) return;
  answered[i]=picked;
  if(picked===Q[i].a) score++; else if(!store.includes(i)){store.push(i);localStorage.setItem("aiGovMissed",JSON.stringify(store));}
  render();
};
$("prev").onclick=()=>{ if(idx>0){idx--;render();} };
$("next").onclick=()=>{
  if(idx<order.length-1){idx++;render();}
  else finish();
};
function finish(){
  $("quiz").classList.add("hidden"); $("nav").classList.add("hidden");
  const n=order.length, pct=Math.round(score/n*100);
  const missed=order.filter(i=>answered[i]!==undefined&&answered[i]!==Q[i].a);
  const skipped=order.filter(i=>answered[i]===undefined).length;
  $("result").innerHTML=`<div class="big">${score} / ${n} (${pct}%)</div>
   <p>${skipped?skipped+" unanswered. ":""}${missed.length?missed.length+" incorrect.":"No incorrect answers 🎉"}</p>
   ${missed.length?`<button class="primary" id="retryMissed">Retry incorrect</button> `:""}
   <button id="again">Restart</button>`;
  $("result").classList.remove("hidden");
  $("again").onclick=build;
  if(missed.length) $("retryMissed").onclick=()=>{
    order=missed; idx=0; answered={}; score=0; picked=null;
    $("result").classList.add("hidden"); $("quiz").classList.remove("hidden"); $("nav").classList.remove("hidden"); render();
  };
}
$("restart").onclick=build; $("shuffle").onchange=build; $("flaggedOnly").onchange=build;
build();
</script>
