<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Flashcard Study – AAISM</title>
<style>
:root{--navy:#1f2a5c;--navy2:#2b3977;--bg:#f5f5f5;--line:#e3e3e3;--text:#333;--ok:#2e9e5b;--rev:#e8a317}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:"Segoe UI","Open Sans",Arial,sans-serif;font-size:14px}
.wrap{max-width:1100px;margin:0 auto;padding:14px 18px 60px}
h1{font-size:18px;margin:4px 0 8px}
.tabbar{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:1px solid var(--line);margin-bottom:20px;flex-wrap:wrap;gap:8px}
.tabs{display:flex}
.tabs button{background:none;border:0;border-bottom:2px solid transparent;padding:9px 16px;font:inherit;font-size:13px;cursor:pointer;color:#333;margin-bottom:-1px}
.tabs button:hover{background:#ececec}
.tabs button.active{color:var(--navy);font-weight:700;border-bottom-color:var(--navy)}
.portal{color:var(--navy);font-size:15px;text-decoration:underline;padding-bottom:8px}

.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.toolbar input[type=search]{flex:1;min-width:200px;padding:8px 12px;border:1px solid #cdd2ea;border-radius:4px;font:inherit;background:#fff}
select{padding:8px 10px;border:1px solid #cdd2ea;border-radius:4px;font:inherit;background:#fff}
.btn{background:var(--navy);color:#fff;border:0;border-radius:4px;padding:8px 14px;font:inherit;font-size:13px;cursor:pointer}
.btn:hover{background:var(--navy2)}
.btn.ghost{background:#fff;color:var(--navy);border:1px solid var(--navy)}
.btn.ghost:hover{background:#eef0fa}
.btn.on{background:var(--navy);color:#fff}
.btn:disabled{opacity:.45;cursor:default}

.stats{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.pill{background:#eef0fa;border-radius:20px;padding:5px 14px;font-size:13px}
.pill b{color:var(--navy);margin-left:4px}
.pill.k b{color:var(--ok)} .pill.r b{color:#b9780a}
.bar{height:6px;background:#e1e4f2;border-radius:3px;overflow:hidden;margin-bottom:18px;display:flex}
.bar i{display:block;height:100%}
.bar .bk{background:var(--ok)} .bar .br{background:var(--rev)}

/* flip card */
.scene{perspective:1400px;max-width:760px;margin:0 auto}
.card{position:relative;width:100%;height:340px;transform-style:preserve-3d;transition:transform .45s;cursor:pointer}
.card.flip{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:12px;background:#fff;box-shadow:0 2px 10px rgba(0,0,0,.12);padding:24px 30px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;border:2px solid #d7dcf2}
.face.back{transform:rotateY(180deg);justify-content:flex-start;align-items:stretch;text-align:left;overflow:auto;border-color:#b9c2ec}
.face .lbl{position:absolute;top:12px;left:18px;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:#888}
.face .no{position:absolute;top:12px;right:18px;font-size:12px;color:#888}
.face .term{font-size:34px;font-weight:700;color:var(--navy);line-height:1.2}
.face .hint{position:absolute;bottom:12px;font-size:12px;color:#999}
.face.back .def{margin:26px 0 0;font-size:16px;line-height:1.55}
.face.back .def+.def{margin-top:14px;padding-top:14px;border-top:1px dashed #ccd;}
.face.back .big{font-size:20px}
.card.k .face{border-color:var(--ok)} .card.r .face{border-color:var(--rev)}
.badge{position:absolute;bottom:12px;right:18px;font-size:12px;font-weight:700;padding:2px 10px;border-radius:10px;color:#fff}
.badge.k{background:var(--ok)} .badge.r{background:var(--rev)}

.nav{display:flex;justify-content:center;align-items:center;gap:10px;margin:18px 0 10px;flex-wrap:wrap}
.nav .btn{min-width:110px;padding:10px 16px;font-size:14px}
.nav .good{background:var(--ok)} .nav .good:hover{background:#25834b}
.nav .again{background:var(--rev)} .nav .again:hover{background:#c98b0e}
.keys{text-align:center;color:#888;font-size:12px;margin-top:8px}
.empty{text-align:center;padding:60px 10px;color:#666;font-size:16px}

/* list view */
.list{display:flex;flex-direction:column;gap:8px}
.item{background:#fff;border-radius:6px;box-shadow:0 1px 2px rgba(0,0,0,.07);border-left:5px solid #d7dcf2}
.item.k{border-left-color:var(--ok)} .item.r{border-left-color:var(--rev)}
.item .hd{display:flex;align-items:center;gap:10px;padding:12px 14px;cursor:pointer}
.item .hd b{flex:1;font-size:15px;color:var(--navy)}
.item .bd{display:none;padding:0 14px 12px;color:#444;line-height:1.55}
.item.open .bd{display:block}
.item .bd p{margin:6px 0}
.item .mk{display:flex;gap:6px;margin-top:8px}
.item .mk button{font-size:12px;padding:4px 10px}
.chev{transition:transform .2s;color:#777}
.item.open .chev{transform:rotate(180deg)}
mark{background:#fff0a8;padding:0 1px}
.tag{font-size:11px;font-weight:700;color:#fff;border-radius:9px;padding:1px 8px}
.tag.k{background:var(--ok)} .tag.r{background:var(--rev)}

@media (max-width:640px){.card{height:420px}.face .term{font-size:26px}.face.back .def{font-size:14.5px}}
</style>
</head>
<body>
<div class="wrap">
  <h1>Flashcard Study</h1>
  <div class="tabbar">
    <div class="tabs">
      <button id="tabStudy" class="active">Study</button>
      <button id="tabList">Glossary list</button>
    </div>
    <a class="portal" href="index.html">Go to User Portal</a>
  </div>

  <div class="toolbar">
    <input type="search" id="q" placeholder="Search terms or definitions…">
    <select id="filter">
      <option value="all">All cards</option>
      <option value="unseen">Not yet marked</option>
      <option value="review">Need review</option>
      <option value="known">Known</option>
    </select>
    <select id="side">
      <option value="term">Show term first</option>
      <option value="def">Show definition first</option>
    </select>
    <button class="btn ghost" id="shuf">🔀 Shuffle</button>
    <button class="btn ghost" id="reset" title="Clear all Known / Review marks">Reset marks</button>
  </div>

  <div class="stats">
    <span class="pill">Showing<b id="sShow">0</b></span>
    <span class="pill k">Known<b id="sK">0</b></span>
    <span class="pill r">Need review<b id="sR">0</b></span>
    <span class="pill">Not yet marked<b id="sU">0</b></span>
  </div>
  <div class="bar"><i class="bk" id="bK"></i><i class="br" id="bR"></i></div>

  <section id="studyView"></section>
  <section id="listView" style="display:none"></section>
</div>

<script>
/* =========================================================
   CARD DATABASE (from AAISM Flashcard.txt)
   ========================================================= */
const CARDS = [{"n": 1, "term": "Accuracy", "defs": ["The fraction of predictions that a classification model predicted correctly. In multiclass classification, accuracy is defined as correct predictions divided by total number of examples. In binary classification, accuracy is defined as true positives plus true negatives divided by total number of examples."]}, {"n": 2, "term": "Active learning", "defs": ["A training approach in which the algorithm chooses some of the data from which it learns. Active learning is particularly valuable when labeled examples are scarce or expensive to obtain. Instead of blindly seeking a diverse range of labeled examples, an active learning algorithm selectively seeks the specific range of examples that it needs for learning."]}, {"n": 3, "term": "AI designer", "defs": ["A professional who creates and implements artificial intelligence solutions"]}, {"n": 4, "term": "AI observability", "defs": ["The practice of monitoring and analyzing models to ensure they are reliable, effective, and correct"]}, {"n": 5, "term": "Algorithm", "defs": ["A finite set of well-defined, unambiguous rules for the solution of a problem in a finite number of steps. It is a sequence of operational actions that lead to a desired goal and is the basic building block of a program."]}, {"n": 6, "term": "Artificial intelligence", "defs": ["An advanced computer system that can simulate human capabilities, such as analysis, based on a predetermined set of rules"]}, {"n": 7, "term": "Artificial general intelligence", "defs": ["A type of AI characterized by its ability to undertake any intellectual task a human can perform, mimicking human sensory perception, fine motor skills, problem solving, navigation, natural language understanding, creativity, and social-emotion engagement"]}, {"n": 8, "term": "Artificial narrow intelligence", "defs": ["A form of AI that is limited to a specific domain or area of knowledge and simulates human cognition"]}, {"n": 9, "term": "Average precision", "defs": ["A metric for summarizing the performance of a ranked sequence of results. Average precision is calculated by taking the average of the precision values for each relevant result in a ranked list (each result in the ranked list where the recall increases relative to the previous result)."]}, {"n": 10, "term": "Backpropagation", "defs": ["An algorithm for iteratively adjusting the weights used in a neural network system. Backpropagation is often used to implement gradient descent."]}, {"n": 11, "term": "Bayes’ theorem", "defs": ["An equation for calculating the probability that something is true if something potentially related to it is true. If P(A) means “the probability that A is true” and P(A|B) means “the probability that A is true if B is true,” then Bayes’ Theorem tells us that P(A|B) = (P(B|A)P(A)) / P(B)."]}, {"n": 12, "term": "Bayesian network", "defs": ["Graphs that compactly represent the relationship between random variables for a given problem. These graphs aid reasoning or decision making in the face of uncertainty. These networks are usually represented as graphs in which the link between any two nodes is assigned a value representing the probabilistic relationship between those nodes."]}, {"n": 13, "term": "Bias", "defs": ["In machine learning (ML), systemic errors or distortions either in algorithms, data, or models that lead to prejudiced results"]}, {"n": 14, "term": "Boosting", "defs": ["A machine learning technique that iteratively combines a set of simple and not very accurate classifiers (referred to as “weak” classifiers) into a classifier with high accuracy (a “strong” classifier) by upweighting the examples the model is currently misclassifying"]}, {"n": 15, "term": "Calibration layer", "defs": ["A post-prediction adjustment typically used to account for prediction bias. The adjusted predictions and probabilities should match the distribution of an observed set of labels."]}, {"n": 16, "term": "Checkpoint", "defs": ["Data that captures the state of the variables of a model at a particular time. Checkpoints enable exporting model weights and performing training across multiple sessions. Checkpoints also enable training to continue past errors (e.g., job preemption)."]}, {"n": 17, "term": "Chi-square test", "defs": ["An analysis technique used to estimate whether two variables in a cross-tabulation are correlated. A chi-square distribution varies from normal distribution based on the “degrees of freedom” used to calculate it."]}, {"n": 18, "term": "Classification", "defs": ["The identification of two or more categories in which an item belongs"]}, {"n": 19, "term": "Clustering", "defs": ["An algorithm for dividing data instances into groups—not a predetermined set of groups, but groups identified by the execution of the algorithm because of similarities found among the instances. The center of each cluster is known as the “centroid.”"]}, {"n": 20, "term": "Coefficient", "defs": ["A number or algebraic symbol prefixed as a multiplier to a variable or unknown quantity (e.g., x in x(y + z), 6 in 6ab)"]}, {"n": 21, "term": "Confidence interval", "defs": ["A range specified for an estimate to indicate margin of error, combined with a probability that a value will fall in that range"]}, {"n": 22, "term": "Continuous feature", "defs": ["A floating-point feature with an infinite range of possible values; contrasts with discrete feature"]}, {"n": 23, "term": "Continuous variable", "defs": ["A variable whose value can be any of an infinite number of values, typically within a particular range"]}, {"n": 24, "term": "Convenience sampling", "defs": ["The use of a dataset that is not gathered scientifically in order to run quick experiments. Later on, it is essential to switch to a scientifically gathered dataset."]}, {"n": 25, "term": "Convergence", "defs": ["A state reached during training in which training loss and validation loss change very little or not at all with each iteration after a certain number of iterations"]}, {"n": 26, "term": "Correlation", "defs": ["The degree of relative correspondence between two sets of data. The correlation coefficient is a measure of how closely the two datasets correlate."]}, {"n": 27, "term": "Covariant", "defs": ["A measure of the relationship between two variables whose values are observed at the same time. Whereas variance measures how a single variable deviates from its mean, covariance measures how two variables vary in tandem from their means."]}, {"n": 28, "term": "Cross-validation", "defs": ["A mechanism for estimating how well a model will generalize to new data by testing the model against one or more nonoverlapping data subsets that are withheld from the training set"]}, {"n": 29, "term": "Data", "defs": ["Representations of facts, concepts or instructions in a manner suitable for communication, interpretation or processing by humans or by automated means. In the simplest terms, data consists of pieces of information. (ISACA)", "Qualitative or quantitative-based information that can be recorded, communicated and analyzed (CMMI)"]}, {"n": 30, "term": "Data analysis", "defs": ["Obtaining an understanding of data by considering samples, measurement, and visualization. Data analysis can be particularly useful when a dataset is first received, before the first model is built; it is crucial for understanding experiments and debugging problems with the system."]}, {"n": 31, "term": "Data augmentation", "defs": ["Artificially boosting the range and number of training examples by transforming existing examples to create additional examples"]}, {"n": 32, "term": "Data mining", "defs": ["The use of computers to analyze large datasets to look for patterns that assist people in making business decisions"]}, {"n": 33, "term": "Data science", "defs": ["A new branch of science used to extract knowledge and insights from large and complex datasets. Data science work often requires knowledge of both statistics and software engineering."]}, {"n": 34, "term": "Data structure", "defs": ["A particular arrangement of data units, such as an array or a tree"]}, {"n": 35, "term": "Data wrangling", "defs": ["The conversion of data, often through the use of scripting languages, to make data easier to manage"]}, {"n": 36, "term": "Data frame", "defs": ["A popular data type for representing datasets in pandas. A data frame is analogous to a table. Each column of the data frame has a name (a header), and each row is identified by a number."]}, {"n": 37, "term": "Decision boundary", "defs": ["The separator between classes learned by a model in a binary class or in multiclass classification problems"]}, {"n": 38, "term": "Decision trees", "defs": ["A tree structure to represent a number of possible decision paths and an outcome for each path"]}, {"n": 39, "term": "Deep learning", "defs": ["A multilevel algorithm that gradually identifies things at higher levels of abstraction (e.g., image classification)"]}, {"n": 40, "term": "Deep model", "defs": ["A type of neural network containing multiple hidden layers"]}, {"n": 41, "term": "Dependent variable", "defs": ["In artificial intelligence (AI), the outcome predicted by a model, which is influenced by other independent variables"]}, {"n": 42, "term": "Dimension reduction", "defs": ["A technique to extract one or more dimensions that capture as much of the variation in the data as possible"]}, {"n": 43, "term": "Dimensionality", "defs": ["In statistics, how many attributes a dataset has"]}, {"n": 44, "term": "Discrete variable", "defs": ["A variable whose potential value must be one of a specific number of values; also known as discrete feature."]}, {"n": 45, "term": "Discriminative model", "defs": ["A model that predicts labels from a set of one or more features. A discriminative model defines the conditional probability of an output based on features and weights."]}, {"n": 46, "term": "Downsampling", "defs": ["Reducing the amount of information in a feature to train a model more efficiently"]}, {"n": 47, "term": "Dynamic model", "defs": ["A model that is trained online in a continuously updating fashion—that is, data continuously entering the model"]}, {"n": 48, "term": "False negative", "defs": ["An example in which the model mistakenly predicted the negative class"]}, {"n": 49, "term": "False positive", "defs": ["An example in which the model mistakenly predicted the positive class"]}, {"n": 50, "term": "Feature", "defs": ["The machine-learning expression for a piece of measurable information about something. For example, if researchers store the age, annual income, and weight of a set of people, they are storing three features about them."]}, {"n": 51, "term": "Feature cross", "defs": ["A synthetic feature formed by crossing (i.e., taking a Cartesian product of) individual binary features obtained from categorical data or from continuous features via bucketing. Feature crosses help represent nonlinear relationships."]}, {"n": 52, "term": "Federated learning", "defs": ["A distributed machine learning approach that trains machine learning models using decentralized examples residing on devices such as smartphones"]}, {"n": 53, "term": "Feedforward neural network", "defs": ["A neural network without cyclic or recursive connections. For example, traditional deep neural networks are feedforward neural networks."]}, {"n": 54, "term": "Few-shot learning", "defs": ["A machine learning approach, often used for object classification, designed to learn effective classifiers from a small number of training examples"]}, {"n": 55, "term": "Garbage in, garbage out", "defs": ["The concept of data that is nonsensical, or flawed, especially as it relates to the computational sciences"]}, {"n": 56, "term": "Generalization", "defs": ["The ability of a model to make correct predictions on new, previously unseen data, as opposed to the data used to train the model"]}, {"n": 57, "term": "Generative artificial intelligence", "defs": ["A branch of artificial intelligence (AI) that uses models to learn underlying patterns and relationships within data in order to create new and diverse content, such as images, text, audio, or code"]}, {"n": 58, "term": "Gradient boosting", "defs": ["A machine learning technique for regression and classification problems that produces a prediction model in the form of an ensemble of weak prediction models, typically decision trees. It builds the model in a stage-wise fashion, like other boosting methods, and generalizes them by allowing the optimization of an arbitrary differentiable loss function."]}, {"n": 59, "term": "Hallucination", "defs": ["In the context of AI, a model’s generation of inaccurate or misleading information that is not grounded in the input data or reality"]}, {"n": 60, "term": "Hidden layer", "defs": ["A synthetic layer in a neural network between the input layer (the features) and the output layer (the prediction). Hidden layers typically contain an activation function (e.g., ReLU) for training. A deep neural network contains more than one hidden layer."]}, {"n": 61, "term": "Human in the Loop (HITL)", "defs": ["A design approach in which humans are empowered to supervise, validate, or override automated or semi-automated systems or processes in order to achieve responsible outcomes."]}, {"n": 62, "term": "Hyperparameter", "defs": ["A parameter that specifies the details of the learning process"]}, {"n": 63, "term": "Inference", "defs": ["The process of making predictions by applying the trained model to unlabeled examples in machine learning"]}, {"n": 64, "term": "K-means clustering", "defs": ["A data-mining algorithm to cluster, classify or group N objects based on their attributes or features into K number of groups (so-called clusters)"]}, {"n": 65, "term": "K-nearest neighbors", "defs": ["A machine learning algorithm that classifies things based on their similarity to nearby neighbors. The algorithm execution is refined by picking the number of neighbors to examine (k) and some notion of distance to indicate how near the neighbors are."]}, {"n": 66, "term": "Keras", "defs": ["A popular Python machine learning API"]}, {"n": 67, "term": "Label", "defs": ["In supervised learning, the answer or result portion of an example"]}, {"n": 68, "term": "Latent variable", "defs": ["A variable that is not directly observed but rather inferred (through a mathematical model) from other variables that are observed (directly measured)"]}, {"n": 69, "term": "Linear regression", "defs": ["A mathematical technique to look for a linear relationship when starting with a set of data points that do not line up nicely. A linear relationship is one in which the relationship between two varying amounts, such as price and sales, can be expressed with an equation that can be represented as a straight line on a graph."]}, {"n": 70, "term": "Logistic regression", "defs": ["A model similar to linear regression but with potential results delivered as a specific set of categories, instead of being continuous"]}, {"n": 71, "term": "Machine learning", "defs": ["A program or system that builds (i.e., trains) a predictive model from input data"]}, {"n": 72, "term": "Machine learning model", "defs": ["The model artifact created by the machine learning training process. The process of training a machine learning model involves providing a machine learning model algorithm (that is, the learning algorithm) with training data."]}, {"n": 73, "term": "Model", "defs": ["A method to describe a given set of components and how those components relate to each other to describe the main workings of an object, system, or concept", "In machine learning (ML), the outcome of a training process. A trained model can automatically process data that was not used for its training to perform a specific set of tasks."]}, {"n": 74, "term": "Model card", "defs": ["Files that accompany AI models and provide concise information about the model details (e.g., architecture, training dataset), performance metrics, and even use case limitations"]}, {"n": 75, "term": "N-gram", "defs": ["The analysis of sequences of “n” items (typically, words in natural language) to look for patterns. The value of “n” can be anything. An n-gram is used to construct statistical models of documents (e.g., when automatically classifying them) and to find positive or negative terms associated with a product name."]}, {"n": 76, "term": "Naive Bayes classifier", "defs": ["A collection of classification algorithms based on Bayes’ Theorem. It is a family of algorithms that share a common principle that every feature being classified is independent of the value of any other feature."]}, {"n": 77, "term": "Neural network", "defs": ["Networks, inspired by the structure of the human brain, that learn by processing data through three layers (input, hidden, and output). They can be trained to match any input to various outputs, including binary ones, making them versatile tools in deep learning (DL) for tasks like image recognition."]}, {"n": 78, "term": "Neuron", "defs": ["A neural network node that typically takes in multiple input values and generates one output value"]}, {"n": 79, "term": "Node (neural network)", "defs": ["A neuron in a hidden layer"]}, {"n": 80, "term": "Noise", "defs": ["Data transmission or dataset disturbances, such as static, that cause messages to be misinterpreted by the receiver"]}, {"n": 81, "term": "Normal distribution", "defs": ["A probability distribution that, when graphed, is a symmetrical bell curve with the mean value at the center. The standard deviation value affects the height and width of the graph. Also known as “Gaussian distribution.”"]}, {"n": 82, "term": "Normalization", "defs": ["The elimination of redundant data", "The process of converting an actual range of values into a standard range of values, typically -1 to +1 or 0 to 1"]}, {"n": 83, "term": "Null hypothesis", "defs": ["If the proposed model for a dataset indicates that the value of “x” affects the value of “y,” then the null hypothesis—i.e., the model compared against the proposed model to check whether “x” really is affecting “y”—will find that the observations are all based on chance and there is no effect. The smaller the P-value computed from the sample data, the stronger the evidence is against the null hypothesis."]}, {"n": 84, "term": "Observation", "defs": ["The receipt of messages through electronic, sensory, or vibrational signals, or through the human senses"]}, {"n": 85, "term": "Offline inference", "defs": ["The process of generating a group of predictions, storing those predictions, and then retrieving them on demand"]}, {"n": 86, "term": "One-shot learning", "defs": ["A machine learning approach often used for object classification that is designed to learn effective classifiers from a single training example"]}, {"n": 87, "term": "Outlier", "defs": ["Extreme values that might be errors in measurement and recording or accurate reports of rare events"]}, {"n": 88, "term": "Overfitting", "defs": ["A model of training data that takes too many of data quirks and outliers into account and thus is overly complicated and has limited ability to find patterns in test data"]}, {"n": 89, "term": "P value", "defs": ["The probability, under the assumption of no effect or no difference (the null hypothesis), of obtaining a result equal to or more extreme than what was actually observed"]}, {"n": 90, "term": "Pandas", "defs": ["A Python library for data manipulation that is popular with data scientists"]}, {"n": 91, "term": "Perceptron", "defs": ["A neural network that approximates a single neuron with n binary inputs. It computes a weighted sum of its inputs and fires if that weighted sum is zero or greater."]}, {"n": 92, "term": "Perplexity", "defs": ["One measure of how well a model is accomplishing its task"]}, {"n": 93, "term": "Predictive analytics", "defs": ["The analysis of data to predict future events, typically to aid in business planning. Predictive analytics incorporates predictive modeling and other techniques. Machine learning may be considered a set of algorithms to help implement predictive analytics."]}, {"n": 94, "term": "Predictive modeling", "defs": ["The development of statistical models to predict future events"]}, {"n": 95, "term": "Preprocessing", "defs": ["Procedures and techniques for cleaning, transforming, and formatting data to enhance its quality and suitability for analysis and modeling"]}, {"n": 96, "term": "Principal component analysis", "defs": ["An algorithm that looks at the direction with the most variance and then determines that it is the first principal component. This is very similar to how regression works in that it determines the best direction to map data."]}, {"n": 97, "term": "Random forest", "defs": ["An ensemble approach to finding the decision tree that best fits the training data by creating many decision trees and then determining the average one. The random part of the term refers to building each of the decision trees from a random selection of features; the forest refers to the set of decision trees."]}, {"n": 98, "term": "Recurrent neural network", "defs": ["A neural network that is intentionally run multiple times, with parts of each run feeding into the next run"]}, {"n": 99, "term": "Regression model", "defs": ["A type of model that outputs continuous (typically floating-point) values"]}, {"n": 100, "term": "Reinforcement learning", "defs": ["A class of machine learning algorithms in which the process is not given specific goals to meet but, as it makes decisions, is instead given indications of whether it is doing well or not"]}, {"n": 101, "term": "Scalar", "defs": ["A quantity that has magnitude but no direction in space, such as volume or temperature"]}, {"n": 102, "term": "Scaling", "defs": ["A commonly used practice in feature engineering to tame the range of values of a feature to match the scale of other features in the dataset"]}, {"n": 103, "term": "Sensitive attribute", "defs": ["A human attribute that may be given special consideration for legal, ethical, social, or personal reasons"]}, {"n": 104, "term": "Serial correlation", "defs": ["The relationship between a variable and a lagged version of itself over various time intervals. Repeating patterns often show a serial correlation when the level of a variable affects its future level."]}, {"n": 105, "term": "Spatiotemporal data", "defs": ["Time series data that includes geographic identifiers, such as latitude-longitude pairs"]}, {"n": 106, "term": "Strata, stratified sampling", "defs": ["Sampling technique used to divide units into homogeneous groups (strata) and draw a simple random sample from each group"]}, {"n": 107, "term": "Supervised learning", "defs": ["A type of machine learning algorithm in which a system is taught to classify input into specific, known classes"]}, {"n": 108, "term": "Tableau", "defs": ["A commercial data visualization package often used in data science projects"]}, {"n": 109, "term": "Telemetry", "defs": ["The process of recording and transmitting instrument readings"]}, {"n": 110, "term": "TensorFlow", "defs": ["A large-scale, distributed, machine learning platform"]}, {"n": 111, "term": "Test set", "defs": ["The subset of the dataset used to test a model after the model has gone through initial vetting by the validation set"]}, {"n": 112, "term": "Time series data", "defs": ["Measurements of observations accompanied by datetime stamps"]}, {"n": 113, "term": "Training", "defs": ["The process of determining the ideal parameters comprising a model"]}, {"n": 114, "term": "Underfitting", "defs": ["Result of a machine learning (ML) model being too simple to capture the complexities and underlying structure of the data, resulting in poor performance for both the training and text data"]}, {"n": 115, "term": "Unsupervised learning", "defs": ["A class of machine learning algorithms designed to identify groups of data without knowing what the groups will be in advance"]}, {"n": 116, "term": "Variance", "defs": ["The measure of how much a list of numbers varies from the mean (average) value. It is frequently used in statistics to measure how large the differences are in a set of numbers. It is calculated by averaging the squared difference of every number from the mean.", "In artificial intelligence (AI), the measure of how much the model varies when it is trained on different subsets of training data. A model with high variance is very sensitive to the training data and might tend to overfit."]}, {"n": 117, "term": "Vector", "defs": ["An ordered set of real numbers, each denoting a distance on a coordinate axis. These numbers may represent a series of details about a single person, movie, product, or the entity being modeled."]}, {"n": 118, "term": "Vector space", "defs": ["A collection of vectors (e.g., a matrix)"]}, {"n": 119, "term": "Weight", "defs": ["A coefficient for a feature in a linear model or an edge in a deep network"]}, {"n": 120, "term": "Width", "defs": ["The number of neurons in a particular layer of a neural network"]}];
const STORE = 'aaismFlashcards.v1';

const $ = s => document.querySelector(s);
function h(tag, props, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(props || {})) {
    if (k === 'class') e.className = v; else if (k === 'html') e.innerHTML = v;
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), v); else if (v != null && v !== false) e.setAttribute(k, v);
  }
  for (const kid of kids.flat()) { if (kid == null || kid === false) continue; e.append(kid.nodeType ? kid : document.createTextNode(kid)); }
  return e;
}
const esc = s => s.replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));
const escRe = s => s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');

/* ---------- state ---------- */
let marks = {};  try { marks = JSON.parse(localStorage.getItem(STORE)) || {}; } catch (e) {}
const saveMarks = () => { try { localStorage.setItem(STORE, JSON.stringify(marks)); } catch (e) {} };
let view = 'study', order = CARDS.map(c => c.n), idx = 0, flipped = false;
let shuffled = false;

const byN = n => CARDS.find(c => c.n === n);
const stateOf = n => marks[n] || 'u';

function filtered() {
  const q = $('#q').value.trim().toLowerCase(), f = $('#filter').value;
  return order.map(byN).filter(c => {
    const s = stateOf(c.n);
    if (f === 'known' && s !== 'k') return false;
    if (f === 'review' && s !== 'r') return false;
    if (f === 'unseen' && s !== 'u') return false;
    if (q && !(c.term.toLowerCase().includes(q) || c.defs.some(d => d.toLowerCase().includes(q)))) return false;
    return true;
  });
}

function updateStats(list) {
  let k = 0, r = 0; CARDS.forEach(c => { const s = stateOf(c.n); if (s === 'k') k++; else if (s === 'r') r++; });
  $('#sShow').textContent = list.length; $('#sK').textContent = k + ' / ' + CARDS.length; $('#sR').textContent = r; $('#sU').textContent = CARDS.length - k - r;
  $('#bK').style.width = (k / CARDS.length * 100) + '%'; $('#bR').style.width = (r / CARDS.length * 100) + '%';
}

function mark(n, s) {
  if (s === 'u') delete marks[n]; else marks[n] = s; saveMarks();
}

/* ---------- study view ---------- */
function renderStudy() {
  const list = filtered(); const root = $('#studyView'); root.innerHTML = ''; updateStats(list);
  if (!list.length) { root.append(h('div', { class: 'empty' }, 'No cards match your search / filter.')); return; }
  if (idx >= list.length) idx = list.length - 1; if (idx < 0) idx = 0;
  const c = list[idx], s = stateOf(c.n), defFirst = $('#side').value === 'def';
  const termFace = h('div', { class: 'face front' },
    h('span', { class: 'lbl' }, defFirst ? 'Definition' : 'Term'), h('span', { class: 'no' }, 'Card ' + c.n),
    defFirst ? h('div', { class: 'big', style: 'font-size:19px;line-height:1.5;text-align:left;overflow:auto;max-height:260px;width:100%' }, c.defs.map((d, i) => h('p', { style: 'margin:0 0 10px' }, c.defs.length > 1 ? (i + 1) + '. ' + d : d)))
             : h('div', { class: 'term' }, c.term),
    h('span', { class: 'hint' }, 'Click the card or press Space to flip'));
  const defFace = h('div', { class: 'face back' },
    h('span', { class: 'lbl' }, defFirst ? 'Term' : 'Definition'), h('span', { class: 'no' }, 'Card ' + c.n),
    defFirst ? h('div', { class: 'term', style: 'margin:auto;text-align:center' }, c.term)
             : [h('div', { style: 'font-weight:700;color:var(--navy);font-size:18px;margin-top:22px' }, c.term),
                ...c.defs.map((d, i) => h('p', { class: 'def', style: i === 0 ? 'margin-top:8px' : '' }, c.defs.length > 1 ? (i + 1) + '. ' + d : d))]);
  const badge = s !== 'u' ? h('span', { class: 'badge ' + s }, s === 'k' ? 'Known' : 'Review') : null;
  if (badge) { termFace.append(badge.cloneNode(true)); defFace.append(badge); }
  const card = h('div', { class: 'card' + (flipped ? ' flip' : '') + (s !== 'u' ? ' ' + s : ''), onclick: flip }, termFace, defFace);
  const go = d => () => { idx = (idx + d + list.length) % list.length; flipped = false; renderStudy(); };
  const setMark = st => () => { mark(c.n, stateOf(c.n) === st ? 'u' : st); if ($('#filter').value !== 'all') { renderStudy(); return; } idx = (idx + 1) % list.length; flipped = false; renderStudy(); };
  root.append(
    h('div', { class: 'qmeta', style: 'text-align:center;color:#666;margin-bottom:10px' }, 'Card ' + (idx + 1) + ' of ' + list.length + (shuffled ? ' · shuffled' : '')),
    h('div', { class: 'scene' }, card),
    h('div', { class: 'nav' },
      h('button', { class: 'btn ghost', onclick: go(-1) }, '← Previous'),
      h('button', { class: 'btn again', onclick: setMark('r') }, '↻ Review again'),
      h('button', { class: 'btn good', onclick: setMark('k') }, '✓ I know this'),
      h('button', { class: 'btn ghost', onclick: go(1) }, 'Next →')),
    h('div', { class: 'keys' }, 'Keyboard: ← → move · Space flip · K = known · R = review'));
  root._go = go; root._mark = setMark;
}
function flip() { flipped = !flipped; const c = $('#studyView .card'); if (c) c.classList.toggle('flip', flipped); }

/* ---------- list view ---------- */
function hl(text, q) {
  const t = esc(text); if (!q) return t;
  return t.replace(new RegExp('(' + escRe(esc(q)) + ')', 'ig'), '<mark>$1</mark>');
}
function renderList() {
  const list = filtered().slice().sort((a, b) => a.term.localeCompare(b.term, undefined, { sensitivity: 'base' }));
  const root = $('#listView'); root.innerHTML = ''; updateStats(list);
  if (!list.length) { root.append(h('div', { class: 'empty' }, 'No cards match your search / filter.')); return; }
  const q = $('#q').value.trim();
  const wrap = h('div', { class: 'list' });
  list.forEach(c => {
    const s = stateOf(c.n);
    const it = h('div', { class: 'item' + (s !== 'u' ? ' ' + s : '') });
    const hd = h('div', { class: 'hd', onclick: () => it.classList.toggle('open') },
      h('b', { html: hl(c.term, q) }), s !== 'u' ? h('span', { class: 'tag ' + s }, s === 'k' ? 'Known' : 'Review') : null, h('span', { class: 'chev' }, '▾'));
    const bd = h('div', { class: 'bd' },
      c.defs.map((d, i) => h('p', { html: (c.defs.length > 1 ? '<b>' + (i + 1) + '.</b> ' : '') + hl(d, q) })),
      h('div', { class: 'mk' },
        h('button', { class: 'btn ghost', onclick: () => { mark(c.n, s === 'k' ? 'u' : 'k'); renderList(); } }, s === 'k' ? 'Unmark known' : '✓ Known'),
        h('button', { class: 'btn ghost', onclick: () => { mark(c.n, s === 'r' ? 'u' : 'r'); renderList(); } }, s === 'r' ? 'Unmark review' : '↻ Review')));
    it.append(hd, bd); wrap.append(it);
    if (q) it.classList.add('open');
  });
  root.append(wrap);
}

/* ---------- wiring ---------- */
function render() { view === 'study' ? renderStudy() : renderList(); }
function setView(v) {
  view = v; $('#tabStudy').classList.toggle('active', v === 'study'); $('#tabList').classList.toggle('active', v === 'list');
  $('#studyView').style.display = v === 'study' ? '' : 'none'; $('#listView').style.display = v === 'list' ? '' : 'none';
  $('#side').style.display = v === 'study' ? '' : 'none'; $('#shuf').style.display = v === 'study' ? '' : 'none';
  render();
}
$('#tabStudy').onclick = () => setView('study'); $('#tabList').onclick = () => setView('list');
$('#q').addEventListener('input', () => { idx = 0; flipped = false; render(); });
$('#filter').onchange = () => { idx = 0; flipped = false; render(); };
$('#side').onchange = () => { flipped = false; render(); };
$('#shuf').onclick = () => {
  if (!shuffled) { order = order.slice(); for (let i = order.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [order[i], order[j]] = [order[j], order[i]]; } shuffled = true; $('#shuf').textContent = '↩ Original order'; }
  else { order = CARDS.map(c => c.n); shuffled = false; $('#shuf').textContent = '🔀 Shuffle'; }
  idx = 0; flipped = false; render();
};
$('#reset').onclick = () => { if (confirm('Clear all Known / Review marks?')) { marks = {}; saveMarks(); idx = 0; flipped = false; render(); } };
document.addEventListener('keydown', e => {
  if (view !== 'study' || /INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName)) return;
  const r = $('#studyView'); if (!r._go) return;
  if (e.key === 'ArrowRight') r._go(1)(); else if (e.key === 'ArrowLeft') r._go(-1)();
  else if (e.key === ' ') { e.preventDefault(); flip(); }
  else if (e.key.toLowerCase() === 'k') r._mark('k')(); else if (e.key.toLowerCase() === 'r') r._mark('r')();
});
setView('study');
</script>
</body>
