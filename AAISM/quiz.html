<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AAISM Practice Test</title>
<style>
  :root{
    --bg:#f3f5f9; --card:#fff; --ink:#1b1f29; --muted:#5b6475; --line:#dfe3ec;
    --brand:#0f4c81; --brand2:#1b74c9; --ok:#1e8e4e; --okbg:#e3f6e9; --bad:#c0392b; --badbg:#fbe7e4; --meta:#d3d6df;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink);line-height:1.5}
  .wrap{max-width:900px;margin:0 auto;padding:0 16px}
  header{background:linear-gradient(135deg,#0b3558,#1b74c9);color:#fff;padding:20px 20px 22px}
  header .wrap{padding:0}
  header small{letter-spacing:.12em;text-transform:uppercase;opacity:.8;font-size:12px}
  header h1{margin:2px 0 4px;font-size:26px}
  .toprow{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:6px}
  .tools{display:flex;gap:8px;flex-wrap:wrap}
  .tbtn{display:inline-flex;align-items:center;gap:8px;font:inherit;font-size:13px;font-weight:600;cursor:pointer;
        padding:6px 14px;border-radius:8px;border:1px solid rgba(255,255,255,.45);background:rgba(255,255,255,.12);color:#fff}
  .tbtn:hover{background:rgba(255,255,255,.25)}
  .tbtn.active{background:#fff;color:var(--brand);border-color:#fff}
  .tbtn .n{min-width:20px;text-align:center;padding:0 6px;border-radius:99px;background:rgba(255,255,255,.25);font-size:12px;font-weight:700}
  .tbtn.active .n{background:#e6eef7}
  .tbtn .n.hot{background:#e0a800;color:#2b2100}
  .parts{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:18px}
  .pcard{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;font:inherit;cursor:pointer;
         padding:10px 14px;border-radius:10px;border:1px solid rgba(255,255,255,.35);background:rgba(255,255,255,.12);color:#fff;min-height:72px}
  .pcard:hover{background:rgba(255,255,255,.24)}
  .pcard .pk{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;opacity:.85;display:flex;justify-content:space-between;width:100%}
  .pcard .pt{font-size:14px;font-weight:600;line-height:1.3}
  .pcard.active{background:#fff;color:var(--brand);border-color:#fff;box-shadow:0 4px 14px rgba(0,0,0,.18)}
  .pcard.active .pk{opacity:1}
  .pk .cnt{font-weight:700;background:rgba(255,255,255,.25);border-radius:99px;padding:0 8px;letter-spacing:0}
  .pcard.active .cnt{background:#e6eef7}
  .seclabel{margin:16px 0 6px;font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;opacity:.8}
  .secgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:8px}
  .scard{display:flex;align-items:center;gap:10px;text-align:left;font:inherit;font-size:13px;line-height:1.3;cursor:pointer;
         padding:8px 12px;border-radius:8px;border:1px solid rgba(255,255,255,.3);background:rgba(255,255,255,.08);color:#fff;min-height:48px}
  .scard:hover{background:rgba(255,255,255,.2)}
  .scard .no{flex:none;width:22px;height:22px;border-radius:50%;background:rgba(255,255,255,.22);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700}
  .scard .nm{flex:1}
  .scard .bd{flex:none;font-size:11px;font-weight:700;padding:1px 8px;border-radius:99px;background:rgba(255,255,255,.22)}
  .scard.soon{border-style:dashed;opacity:.85}
  .scard.soon .bd{background:transparent;border:1px solid rgba(255,255,255,.45);text-transform:uppercase;letter-spacing:.05em;font-size:10px}
  .scard.active{background:#fff;color:var(--brand);border-color:#fff;font-weight:600;opacity:1}
  .scard.active .no{background:var(--brand);color:#fff}
  .scard.active .bd{background:#e6eef7;border-color:transparent;color:var(--brand)}
  .bar{position:sticky;top:0;z-index:10;background:#fff;border-bottom:1px solid var(--line);box-shadow:0 2px 6px rgba(0,0,0,.05)}
  .bar .wrap{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding-top:10px;padding-bottom:10px}
  .progress{flex:1;min-width:160px;height:8px;background:#e6eaf2;border-radius:99px;overflow:hidden}
  .progress i{display:block;height:100%;width:0;background:var(--brand2);transition:width .25s}
  .stat{font-size:14px;color:var(--muted);white-space:nowrap}
  .stat b{color:var(--ink)}
  button{font:inherit;cursor:pointer;border-radius:8px;border:1px solid var(--brand);background:#fff;color:var(--brand);padding:6px 12px}
  button:hover{background:#eef5fc}
  button.primary{background:var(--brand);color:#fff}
  button.primary:hover{background:#0b3a63}
  button:disabled{opacity:.45;cursor:not-allowed}
  .q{background:var(--card);border:1px solid var(--line);border-radius:12px;margin:18px 0;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.05)}
  .q.correct{border-color:#8fd3a8}
  .q.wrong{border-color:#e2a199}
  .qh{padding:16px 18px 8px;position:relative}
  .qtop{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
  .qn{font-size:12px;font-weight:700;color:var(--brand);letter-spacing:.06em;text-transform:uppercase}
  .qt{margin:4px 0 10px;font-size:16.5px}
  .opts{list-style:none;margin:0;padding:0 18px 16px}
  .opt{display:flex;gap:10px;padding:9px 12px;margin:6px 0;border:1px solid var(--line);border-radius:8px;cursor:pointer;background:#fff}
  .opt:hover{background:#f5f8fd;border-color:#b8c8e0}
  .opt .l{font-weight:700;min-width:20px}
  .opt.sel{border-color:var(--brand2);background:#eaf3fd;box-shadow:0 0 0 2px #cfe3f8}
  .q.done .opt{cursor:default}
  .q.done .opt:hover{background:#fff;border-color:var(--line)}
  .opt.right{background:var(--okbg)!important;border-color:var(--ok)!important;box-shadow:none}
  .opt.miss{background:var(--badbg)!important;border-color:var(--bad)!important;box-shadow:none}
  .actions{padding:0 18px 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
  .actions button{padding:8px 18px;font-weight:600}
  button.retry{border-color:var(--bad);color:var(--bad)}
  button.retry:hover{background:#fdeeed}
  .ans{display:none;background:var(--okbg);border-top:1px solid #a7dcb9;padding:14px 18px 16px}
  .q.wrong .ans{background:var(--badbg);border-top-color:#e8b9b3}
  .q.show .ans{display:block}
  .verdict{font-weight:700;margin-bottom:2px}
  .ans h4{margin:6px 0 6px;font-size:18px;font-weight:600;color:#3a3f4b}
  .just{list-style:none;margin:0 0 12px;padding:0}
  .just li{display:flex;gap:8px;margin:5px 0;font-size:15px}
  .just li b.k{min-width:20px}
  .just li.best{font-weight:700}
  .meta{background:var(--meta);border:1px solid #2b3a55;border-radius:6px;padding:10px 14px;font-size:13px}
  .meta div+div{margin-top:8px}
  .meta strong{display:block;font-size:13.5px}
  button.flag{padding:4px 10px;font-size:13px;border-color:#b9bfcc;color:#5b6475;white-space:nowrap}
  button.flag.on{background:#fff4d6;border-color:#e0a800;color:#8a6100;font-weight:600}
  .chip{display:inline-block;font-size:11.5px;padding:1px 8px;border-radius:99px;background:#eef1f7;color:#5b6475;margin-left:6px;text-transform:none;letter-spacing:0;font-weight:600}
  .chip.miss{background:var(--badbg);color:var(--bad)}
  .navrow{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:6px 0 20px}
  .navrow button{padding:10px 20px;font-size:15px}
  .dots{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin:14px 0 4px}
  .dot{position:relative;width:26px;height:26px;border-radius:50%;border:1px solid var(--line);background:#fff;font-size:12px;
       display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--muted);padding:0}
  .dot.cur{border-color:var(--brand2);color:var(--brand);font-weight:700;box-shadow:0 0 0 2px #cfe3f8}
  .dot.ok{background:var(--okbg);border-color:var(--ok);color:var(--ok)}
  .dot.no{background:var(--badbg);border-color:var(--bad);color:var(--bad)}
  .dot.fl::after{content:"";position:absolute;top:-2px;right:-2px;width:9px;height:9px;border-radius:50%;background:#e0a800;border:1.5px solid #fff}
  .empty{background:#fff;border:1px dashed var(--line);border-radius:12px;padding:36px 20px;text-align:center;color:var(--muted);margin:18px 0}
  .empty b{display:block;font-size:18px;color:var(--ink);margin-bottom:4px}
  .result{display:none;background:#fff;border:1px solid var(--line);border-radius:12px;padding:20px;margin:20px 0;text-align:center}
  .result.on{display:block}
  .result .big{font-size:40px;font-weight:700;color:var(--brand)}
  .result .row{display:flex;gap:10px;justify-content:center;margin-top:14px;flex-wrap:wrap}
  main{padding-bottom:40px}
  .hidden{display:none!important}
  @media (max-width:900px){ .parts{grid-template-columns:repeat(2,1fr)} }
  a.tbtn{text-decoration:none}
  @media (max-width:720px){ .parts{grid-template-columns:1fr} .secgrid{grid-template-columns:1fr} }
</style>
</head>
<body>

<header>
  <div class="wrap">
    <div class="toprow">
      <small>AAISM practice test</small>
      <div class="tools"><a class="tbtn" href="index.html" title="Back to the User Portal">← User Portal</a><span class="tools" id="tools"></span></div>
    </div>
    <h1 id="hTitle"></h1>
    <div class="parts" id="parts"></div>
    <div class="seclabel" id="secLabel"></div>
    <div class="secgrid" id="secs"></div>
  </div>
</header>

<div class="bar">
  <div class="wrap">
    <div class="stat">Question <b id="sCur">1</b> of <b id="sTot">0</b></div>
    <div class="progress"><i id="pBar"></i></div>
    <div class="stat">Correct <b id="sOk">0</b> / <b id="sAns">0</b> answered</div>
    <button id="btnReset">Restart</button>
  </div>
</div>

<main class="wrap">
  <div id="quiz">
    <div class="dots" id="dots"></div>
    <div id="list"></div>
    <div class="navrow" id="navrow">
      <button id="btnPrev">← Previous</button>
      <button id="btnNext" class="primary">Next →</button>
    </div>
  </div>
  <div class="result" id="result">
    <div id="rTitle">Your score</div>
    <div class="big" id="rScore"></div>
    <div id="rMsg" style="color:#5b6475"></div>
    <div class="row">
      <button id="btnNextSec" class="primary">Next section →</button>
      <button id="btnReview">Practice incorrect / unanswered</button>
      <button id="btnBack">Back to questions</button>
      <button id="btnRestart">Restart</button>
    </div>
  </div>
</main>

<script>
const TASKS = {
  1:"Collaborate on charter, roles, and responsibilities for governance and management of AI to align with business objectives",
  2:"Establish and maintain AI-specific security policies and procedures to inform the development and implementation of AI standards and guidelines",
  3:"Ensure the responsible use of AI by utilizing leading practices, ethical principles, regulatory requirements, and industry frameworks",
  4:"Participate in or oversee the AI risk management life cycle, including impacts on enterprise risk",
  5:"Identify and assess the AI threat landscape",
  6:"Monitor for internal and external AI-related factors to identify the need for reassessment of risk",
  7:"Design and implement testing and vulnerability management of AI solutions",
  8:"Conduct AI impact assessments and ensure conformity with regulatory requirements",
  9:"Embed, monitor, and verify AI security requirements when utilizing vendor AI-enabled solutions",
  10:"Design and implement security architecture specifically for AI",
  11:"Advise on the integration of AI architecture as part of enterprise architecture",
  12:"Design, implement, and regularly review AI security controls to treat risk to an acceptable level",
  13:"Establish and maintain processes to identify, inventory, and classify data and assets related to AI",
  14:"Identify and treat security risk associated with data used in the AI life cycle",
  15:"Establish and maintain AI-specific processes to investigate, document, and report on AI security incidents in accordance with regulatory and contractual requirements",
  16:"Establish and maintain AI incident handling processes, including containment, notification, escalation, eradication, and recovery",
  17:"Address AI security risk as part of business continuity and disaster recovery planning",
  18:"Define and monitor security metrics for AI solutions used throughout the organization",
  19:"Review and implement AI security tools as part of the information security program",
  20:"Conduct risk-based human oversight of AI inputs/outputs including trust and safety, quality, explainability, and robustness",
  21:"Develop and maintain AI-specific security awareness training and acceptable use guidelines",
  22:"Advise on security risk and controls related to the AI solution development life cycle within an organization"
};

const Q1 = [
{ t:"Which provides the **MOST** effective mechanism for ensuring data used in retraining is trustworthy and aligns with enterprise artificial intelligence (AI) risk policies?",
  o:["Reuse prior training datasets, as they have already undergone approved data preprocessing and cleansing steps.",
     "Scan the new data with automated anomaly detection tools to identify irregular patterns and potential noise.",
     "Delegate developer teams to handle validation and technical oversight independently from cross-functional risk evaluation.",
     "Implement a formal review process to assess the dataset with adequate human oversight prior to retraining."],
  a:3,
  j:["Although training datasets have followed approved data preprocessing criteria, artificial intelligence (AI) models are typically only retrained when data or model drift has occurred, meaning new or additional data is needed to address this shift.",
     "Automated scanning is helpful but lacks the human contextual judgment needed for nuanced trust and safety decisions.",
     "Developer-only validation lacks cross-functional oversight, increasing the risk of blind spots related to ethics, privacy, or compliance.",
     "Structured, risk-informed review processes that include a human in the loop (HITL) based on structured criteria mitigate data quality, bias, and compliance risk by validating these criteria in AI outputs."],
  k:20 },
{ t:"An artificial intelligence (AI) system used to automate help desk support showed signs of gender bias during testing. After applying mitigation controls, some residual AI bias remains. What is the **BEST** course of action to ensure an acceptable level of risk?",
  o:["Defer risk disclosure regarding bias until postdeployment analysis.",
     "Focus bias security controls on training data to reduce the residual risk.",
     "Document residual bias impacts and inform stakeholders of remaining risk.",
     "Assume low-risk classification if fairness tests pass during internal AI system evaluation."],
  a:2,
  j:["Delaying disclosure opens the enterprise to additional reputational risk.",
     "Training data controls are essential, but additional controls may not be necessary if the residual risk falls below acceptable levels. It is difficult to reduce residual risk to zero.",
     "Documenting residual bias and informing stakeholders supports transparency and ensures ethical and legal responsibilities are addressed before the system goes live.",
     "Passing internal fairness tests does not ensure that risk is adequately addressed or monitored."],
  k:12 },
{ t:"Which step is the **MOST** important consideration regarding the protection of sensitive organization information used by third-party artificial intelligence (AI) solutions when developing AI disaster recovery plans (DRPs)?",
  o:["Ensuring strict data management controls when exposing data to AI tools",
     "Replicating full backups with multiple third-party AI providers for redundancy",
     "Sharing full production datasets openly to ensure AI comprehensiveness",
     "Limiting AI usage exclusively to nonsensitive, publicly available data"],
  a:0,
  j:["Implementing robust data management controls is essential when integrating sensitive organizational data with third-party artificial intelligence (AI) tools, mitigating privacy and security risk.",
     "Replicating backups with multiple providers increases the risk of sensitive data leakage rather than protecting it.",
     "Open sharing of sensitive data exposes the organization to privacy and security risk without addressing disaster recovery planning.",
     "Limiting AI to nonsensitive public data restricts the usefulness of AI in addressing organization-specific recovery needs."],
  k:17 },
{ t:"Which is the **BEST** artificial intelligence (AI) risk treatment option to ensure conformity with regulations?",
  o:["Fix AI system bias using data anonymization method.",
     "Set adjustable AI risk limits to stay compliant.",
     "Use training accuracy as the primary control for compliance.",
     "Apply class balancing techniques to reduce regulatory risk."],
  a:1,
  j:["Anonymization hides data but does not remove bias from logic patterns.",
     "Adjustable artificial intelligence (AI) risk limits help to ensure treatment stays effective over time.",
     "Training accuracy reflects performance on known data, not on unseen risk.",
     "While class balancing can improve performance, it does not guarantee reduction of regulatory risk."],
  k:8 },
{ t:"The **MOST** effective method for managing the risk of data poisoning of an artificial intelligence (AI) model during training is to:",
  o:["Employ user access controls exclusively on AI training hardware.",
     "Implement rigorous input validation and data sanitization processes.",
     "Conduct periodic software vulnerability scans.",
     "Rely solely on anomaly detection tools during the inference phase."],
  a:1,
  j:["User access controls focus on physical or logical access but do not specifically address data integrity.",
     "Input validation and data sanitization directly mitigate the risk of data poisoning by ensuring that only trustworthy data is used during artificial intelligence (AI) model training.",
     "Vulnerability scans focus on detecting software vulnerabilities but do not address data integrity issues related to AI model poisoning.",
     "Anomaly detection helps identify unexpected events. However, anomaly detection during inference does not prevent poisoned data from entering the training process."],
  k:14 },
{ t:"A hospital implemented an artificial intelligence (AI) solution to process patient data. It was suspected that some doctors entered patients’ personal data into the system, violating privacy regulations. Which would be the **MOST** appropriate response?",
  o:["Suspend the usage of the AI solution across the departments.",
     "Conduct root cause analysis followed by an AI risk reassessment.",
     "Update internal AI policies to address human errors and misuse.",
     "Apply liability measures to users for breaching sensitive data."],
  a:1,
  j:["As the event was not yet confirmed, suspending the solution would be a premeditated option. This reactive approach may unnecessarily disrupt healthcare operations without addressing the underlying problem.",
     "Identifying and understanding the root cause of a security-related incident is fundamental for effective risk assessment and response. A reassessment grounded in root cause analysis enables organizations to reframe and respond to risk accurately, especially in cases of human misuse.",
     "Updating internal policies is necessary to deal with human error and misuse as part of a broader set of directives, but policies must be based on a reassessed risk landscape.",
     "Applying liability measures to users addresses symptoms, not the system. Focusing solely on punitive actions treats symptoms rather than causes."],
  k:6 },
{ t:"Which **MOST** effectively supports data integrity risk management for artificial intelligence (AI) systems?",
  o:["Regular manual reviews and audits of AI outputs",
     "Initial validation of training data",
     "Continuous monitoring and dynamic feedback",
     "Periodic software vulnerability scans"],
  a:2,
  j:["Manual checks and audits cannot keep pace with the rapid changes typical of adaptive artificial intelligence (AI) systems regardless of how routinely they are scheduled. This is a reactive method that does not allow fast identification of emerging data integrity issues.",
     "Initial validation of training data is ineffective, as it addresses only initial risk and misses issues that arise after deployment.",
     "Continuous monitoring and ongoing feedback are needed to identify and promptly address data integrity issues as they emerge.",
     "Vulnerability scans focus on detecting software vulnerabilities in systems but do not actively address integrity risk associated with continuous data ingestion."],
  k:14 },
{ t:"Which is **MOST** critical during the early stages of an artificial intelligence (AI) impact assessment to ensure the system’s risk is evaluated appropriately across its deployment context?",
  o:["Identify the intended uses for which the system is designed and tested.",
     "Conduct a red teaming exercise of the model architecture and algorithmic complexity.",
     "Compare similar models in the market to benchmark general performance expectations.",
     "Map out budget constraints to determine the feasibility of long-term monitoring programs."],
  a:0,
  j:["The intended use definition is foundational to risk analysis. It frames stakeholder identification, potential harms, and regulatory triggers (e.g., sensitive or restricted uses) related to the use of the artificial intelligence (AI) solution.",
     "Conducting a red teaming exercise is necessary but secondary to the impact assessment. Red teaming exercises support implementation and model evaluation, not initial risk scoping.",
     "Market benchmarking informs feasibility but does not satisfy compliance requirements or contextual harm analysis.",
     "Budget constraints are relevant later in risk treatment but are not part of early scoping for risk relevance and thresholding."],
  k:8 },
{ t:"Which activity is **BEST** to ensure strong oversight of artificial intelligence (AI) system quality and safety?",
  o:["Regular penetration testing of AI systems",
     "Human-led validation of data sources and input integrity",
     "Continuous increase in AI computational resources",
     "Regular enhancement of AI interface usability"],
  a:1,
  j:["Regular penetration testing of artificial intelligence (AI) systems does not address AI system inputs concerning quality and safety, as it mainly focuses on identifying security issues.",
     "Human validation ensures input data quality and integrity, directly influencing AI system safety.",
     "Continuous increase in AI computational resources addresses operational efficiency, not input quality or safety.",
     "Regular enhancement of AI interface usability focuses on usability without addressing data input quality or safety."],
  k:20 },
{ t:"An organization is selecting an artificial intelligence (AI) model for a critical application. Which practice **MOST** effectively minimizes model selection risk?",
  o:["Choose the model that performed best on the training dataset.",
     "Conduct a comprehensive evaluation of multiple models.",
     "Select a complex model based on theoretical capabilities.",
     "Rely on expert opinion to select the appropriate model."],
  a:1,
  j:["Choosing a model based only on training performance can lead to overfitting and poor generalization, significantly increasing the risk of model failure in real-world applications.",
     "Conducting a comprehensive evaluation of multiple models ensures a well-informed selection process, minimizing the risk of choosing an inadequate model.",
     "Selecting a complex model can lead to unnecessary complexity, increased resource consumption, and potential performance issues. Application requirements must be taken into consideration.",
     "Expert opinion can provide important input when considering an artificial intelligence (AI) model, but relying on expert opinion without additional input and evaluation can introduce bias and increase the risk of selecting a suboptimal model."],
  k:12 },
{ t:"Which action **MOST** effectively ensures that an organization can adapt to evolving artificial intelligence (AI) risk throughout the AI system life cycle?",
  o:["Establish standardized, organizationwide AI risk tolerance levels with annual updates based on industry benchmarks.",
     "Conduct periodic AI system risk reviews aligned with regulatory reporting cycles.",
     "Implement continuous monitoring combined with periodic risk reassessment and clearly defined thresholds for action.",
     "Engage independent third-party auditors to perform yearly scheduled AI risk evaluations."],
  a:2,
  j:["Annual updates to tolerance levels are too infrequent to adapt to fast-moving artificial intelligence (AI) risk factors.",
     "Regulatory reporting cycles (e.g., annual, semiannual) are too infrequent to capture fast-evolving AI risk factors between reporting events. Dynamic threats require continuous monitoring, not just compliance-driven assessments.",
     "Continuous monitoring and periodic risk reassessments allow an organization to dynamically respond to emerging and changing AI risk. Clearly defined thresholds for action provide clear triggers for management responses, ensuring agility and responsiveness throughout the life cycle.",
     "Relying exclusively on external risk assessments neglects the importance of internal organizational context and oversight, potentially causing risk coverage and responsiveness gaps."],
  k:4 },
{ t:"Which security metric would **BEST** indicate the effectiveness of data protection controls for artificial intelligence (AI) systems across an organization?",
  o:["Average computational performance of AI training hardware",
     "Percentage reduction in unauthorized data access incidents",
     "Frequency of AI model updates completed annually",
     "User satisfaction levels with AI interfaces"],
  a:1,
  j:["The computational performance of artificial intelligence (AI) training hardware focuses on performance rather than security.",
     "A reduction in unauthorized data access incidents helps measure the effectiveness of controls protecting data in AI systems from unauthorized access, which is directly related to security objectives.",
     "The frequency of AI model updates per year addresses operational efficiency but does not measure security effectiveness.",
     "User satisfaction levels with AI interfaces evaluate usability, not security protection effectiveness."],
  k:18 },
{ t:"What is the **BEST** method to manage the risk of unfair customer treatment caused by data bias used in the artificial intelligence (AI) system?",
  o:["Retrain with balanced data with fairness indicator tracking.",
     "Use synthetic data to eliminate bias and ensure neutrality.",
     "Remove human intervention to ensure consistent decisions.",
     "Exclude demographic fields to block biased attributes."],
  a:0,
  j:["Retraining with balanced data after fairness tracking maintains oversight and is the core to responsible artificial intelligence (AI) risk treatment.",
     "Without thorough validation and diversity checks, synthetic data is insufficient to ensure trustworthy AI.",
     "Excluding human oversight may weaken ethical oversight and trustworthiness.",
     "Blocking demographic attributes prevents bias testing altogether."],
  k:12 },
{ t:"What should an organization do **FIRST** when integrating artificial intelligence (AI) security risk into existing business continuity and disaster recovery planning?",
  o:["Develop detailed AI threat response procedures.",
     "Identify critical AI systems and dependencies.",
     "Assign roles and responsibilities for AI incident management.",
     "Test recovery of AI models from backups."],
  a:1,
  j:["Detailed threat response procedures are essential to respond to any disruptive event, but their development depends on understanding which artificial intelligence (AI) systems are critical and which processes are missing.",
     "Identifying critical AI systems and dependencies is foundational, as it informs all subsequent business continuity and disaster recovery activities. It ensures that resources focus on the most vital systems first, and it can help the enterprise understand what existing processes may apply to AI solutions and what gaps may exist.",
     "Existing assignments may be sufficient for AI solutions and adjustments would depend on identifying critical AI systems and dependencies.",
     "Testing recovery is essential, but it depends on identifying critical systems first."],
  k:17 },
{ t:"To sustain artificial intelligence (AI) trustworthiness under dynamic operational conditions, which is the **BEST** approach to mitigate emerging risk while maintaining validated assurance levels?",
  o:["Establish continuous output verification aligned with adaptive risk thresholds.",
     "Implement periodic developer attestations to confirm AI integrity postdeployment.",
     "Isolate AI outputs in zero-trust environments during model drift assessment phases.",
     "Disclose AI frameworks publicly to encourage external audit and peer validation."],
  a:0,

{ t:"What is the **MOST** effective security strategy for a travel agency trying to prevent unauthorized access while developing an artificial intelligence (AI) application for customer travel support?",

{ t:"Which phase of the artificial intelligence (AI) life cycle offers the **GREATEST** opportunity to minimize privacy flaws?",

{ t:"Which control is **MOST** effective for detecting unauthorized modifications to a deployed artificial intelligence (AI) model?",

{ t:"During the testing, evaluation, verification, and validation (TEVV) phase of the artificial intelligence (AI) life cycle, red teamers identified and documented a model inversion vulnerability. Which is the **BEST** next step?",

{ t:"How should an enterprise **PRIMARILY** communicate customer rights regarding personal information used by an artificial intelligence (AI) chatbot?",

{ t:"A hospital wishes to implement an artificial intelligence (AI) system to help automate and triage emergency patient diagnoses to increase efficiencies and decrease patient time to see a physician. Which privacy requirement should be met before moving forward with this tool?",

{ t:"An organization is implementing an artificial intelligence (AI) application that conducts demographic analysis. This AI application uses a vector database to store demographic data. Which security control provides the **BEST** protection against information disclosure, while also maintaining privacy, in this scenario?",

{ t:"An organization is building an artificial intelligence (AI) model for loan approvals. During testing, the team notices that its AI model is disproportionately denying loans to a specific demographic. Which would **BEST** identify and address the causes and effects of this issue?",

{ t:"What is the **PRIMARY** objective of transparency in developing ethical artificial intelligence (AI) systems?",

const L = ["A","B","C","D"];
const $ = s => document.querySelector(s);
const fmt = s => s.replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>");

/* ---------- PARTS & SECTIONS ----------
   To add questions to a placeholder, put question objects inside that section's q:[ ... ]
   (same format as the existing arrays). Add any new task statements to TASKS. */
const SECTIONS = [
  /* Part 2 (indexes 0-2 kept so saved flags / missed list stay valid) */
  { part:2, name:"1. AI Risk Assessment, Thresholds, and Treatment", q:Q1, ks:"2A – AI Risk Assessment, Thresholds, and Treatment" },
  { part:2, name:"2. AI Threat and Vulnerability Management",         q:Q2, ks:"2B – AI Threat and Vulnerability Management" },
  { part:2, name:"3. AI Vendor and Supply Chain Management",          q:Q3, ks:"2C – AI Vendor and Supply Chain Management" },
  /* Part 1 */
  { part:1, name:"1. Stakeholder Considerations, Industry Frameworks, and Regulatory Requirements", q:P1S1, ks:"1A – Stakeholder Considerations, Industry Frameworks, and Regulatory Requirements" },
  { part:1, name:"2. AI-related Strategies, Policies, and Procedures",  q:Q4, ks:"1B – AI-related Strategies, Policies, and Procedures" },
  { part:1, name:"3. AI Assets and Data Life Cycle Management",         q:P1S3, ks:"1C – AI Assets and Data Life Cycle Management" },

  { part:1, name:"5. Business Continuity and Incident Response",        q:P1S5, ks:"1E – Business Continuity and Incident Response" },
  /* Part 3 */
  { part:3, name:"1. AI Security Architecture and Design",              q:P3S1, ks:"3A – AI Security Architecture and Design" },
  { part:3, name:"2. AI Life Cycle (e.g., model selection, training, and validation)", q:P3S2, ks:"3B – AI Life Cycle (e.g., model selection, training, and validation)" },
  { part:3, name:"3. Data Management Controls",                         q:P3S3, ks:"3C – Data Management Controls" },
  { part:3, name:"4. Privacy, Ethical, Trust, and Security Controls",   q:P3S4, ks:"3D – Privacy, Ethical, Trust, and Security Controls" },
  { part:3, name:"5. Security Controls and Monitoring",                 q:P3S5, ks:"3E – Security Controls and Monitoring" }
];
const PARTS = {
  1:{ title:"AI Governance and Program Management",                     domain:"1 – AI Governance and Program Management" },
  2:{ title:"Artificial Intelligence Risk and Opportunity Management",  domain:"2 – Artificial Intelligence Risk and Opportunity Management" },
  3:{ title:"AI Technologies and Controls",                             domain:"3 – AI Technologies and Controls" }
};
/* ---------- PART 4 · PRACTICE EXAMS ----------
   Each exam = 45 questions picked at random (proportionally, at least 2 per section) from the 13 sections above.
   Exam 1 and Exam 2 never share a question. Entries are [sectionIndex, questionIndex] into SECTIONS. */
PARTS[4] = { title:"Practice Exams", domain:"Practice Exam" };
const EXAM_PICKS = [[[2, 14], [10, 7], [5, 3], [8, 5], [9, 17], [8, 0], [0, 7], [11, 13], [3, 0], [12, 12], [9, 9], [10, 1], [7, 5], [0, 15], [4, 11], [11, 14], [1, 13], [12, 19], [12, 1], [2, 0], [7, 3], [1, 19], [11, 5], [0, 21], [5, 2], [9, 5], [11, 9], [7, 8], [0, 5], [4, 7], [6, 6], [12, 10], [6, 8], [3, 9], [0, 18], [10, 3], [2, 19], [12, 7], [4, 12], [5, 8], [1, 5], [2, 15], [1, 14], [5, 12], [9, 8]], [[7, 11], [5, 15], [1, 15], [0, 19], [3, 8], [7, 6], [12, 14], [2, 16], [1, 10], [10, 0], [0, 22], [12, 5], [9, 16], [5, 0], [4, 10], [11, 4], [7, 4], [9, 14], [9, 6], [0, 6], [0, 20], [11, 8], [2, 4], [5, 5], [11, 2], [0, 14], [8, 6], [5, 6], [4, 4], [10, 11], [2, 13], [12, 8], [12, 20], [10, 4], [1, 16], [3, 6], [1, 9], [6, 0], [12, 16], [8, 9], [6, 1], [11, 17], [2, 12], [4, 0], [9, 15]]];
EXAM_PICKS.forEach((list,n)=>{
  SECTIONS.push({ part:4, name:"Practice Exam "+(n+1)+" (45 questions)", ks:"",
    q:list.map(([s,i])=>Object.assign({}, SECTIONS[s].q[i], { dom:PARTS[SECTIONS[s].part].domain, ksx:SECTIONS[s].ks })) });
});
const partSecs = p => SECTIONS.map((S,i)=>i).filter(i=>SECTIONS[i].part===p);
const secTag = i => { const S=SECTIONS[i]; if(S.part===4) return "Exam "+(partSecs(4).indexOf(i)+1); return `Part ${S.part} · S${partSecs(S.part).indexOf(i)+1}`; };
const partLast = {};
const secPicks = SECTIONS.map(S => S.q.map(() => null));
const secPos   = SECTIONS.map(() => 0);
let practicePicks = {};
let pend = {};   /* selected-but-not-yet-submitted answers */

/* flags + missed list persist in the browser (localStorage) */
const STORE_KEY = "aaism_p2_v4";
const flags = new Set(), missed = new Set();
try {
  const r = JSON.parse(localStorage.getItem(STORE_KEY) || "null");
  if (r) { (r.flags||[]).forEach(k=>flags.add(k)); (r.missed||[]).forEach(k=>missed.add(k)); }
} catch(e) {}
function save(){ try { localStorage.setItem(STORE_KEY, JSON.stringify({flags:[...flags], missed:[...missed]})); } catch(e) {} }
const keyOf = it => it.s + ":" + it.i;
const qOf = it => SECTIONS[it.s].q[it.i];

let view = { type:"section", sec:0, items:[], pos:0 };
let lastSec = 0, finished = false;

function sectionItems(s){ return SECTIONS[s].q.map((_,i)=>({s,i})); }
function poolFor(type){
  const set = type==="flagged" ? flags : missed, out = [];
  SECTIONS.forEach((S,s)=>S.q.forEach((_,i)=>{ if(set.has(s+":"+i)) out.push({s,i}); }));
  return out;
}
function getPick(it){
  if(view.type==="section") return secPicks[it.s][it.i];
  const p = practicePicks[keyOf(it)]; return p===undefined ? null : p;
}
function setPick(it,n){
  if(view.type==="section") secPicks[it.s][it.i] = n; else practicePicks[keyOf(it)] = n;
  if(n === qOf(it).a) missed.delete(keyOf(it)); else missed.add(keyOf(it));
  save();
}
const isRight = it => getPick(it) === qOf(it).a;

/* ---------- RENDER ---------- */
function render(){
  const n = view.items.length;
  renderPills();
  $("#sTot").textContent = n;
  if(n === 0){
    const msg = view.type==="section"
      ? ["Questions coming soon","No questions have been added to this section yet."]
      : view.type==="flagged"
      ? ["No flagged questions","Use the ⚑ Flag button on any question to save it here."]
      : ["No missed questions 🎉","Questions you answer incorrectly will appear here for re-practice."];
    $("#list").innerHTML = `<div class="empty"><b>${msg[0]}</b>${msg[1]}</div>`;
    $("#dots").innerHTML = ""; $("#navrow").style.display="none";
    $("#sCur").textContent = 0; $("#sAns").textContent = 0; $("#sOk").textContent = 0; $("#pBar").style.width="0";
    return;
  }
  $("#navrow").style.display="";
  const it = view.items[view.pos], q = qOf(it), pick = getPick(it), done = pick !== null;
  const sel = pend[keyOf(it)];
  const cls = ["q", done?"done":"", done?(pick===q.a?"correct":"wrong"):"", done?"show":""].join(" ");
  const opts = q.o.map((txt,k)=>{
    let c = "opt";
    if(done){ if(k===q.a) c+=" right"; else if(k===pick) c+=" miss"; }
    else if(sel===k) c+=" sel";
    return `<li class="${c}" data-o="${k}"><span class="l">${L[k]}.</span><span>${txt}</span></li>`;
  }).join("");
  let actions = "";
  if(!done){
    actions = `<div class="actions"><button class="primary" data-confirm="1" ${sel===undefined?"disabled":""}>Submit</button></div>`;
  } else if(pick!==q.a){
    actions = `<div class="actions"><button class="retry" data-retry="1" title="Reset this question and pick again (R)">↻ Try again</button></div>`;
  }
  const just = q.j.map((txt,k)=>`<li class="${k===q.a?"best":""}"><b class="k">${L[k]}.</b><span>${txt}</span></li>`).join("");
  const verdict = done ? (pick===q.a ? "✔ Correct — " : "✘ Incorrect — ") : "";
  const f = flags.has(keyOf(it));
  const where = view.type==="section" ? "" : `<span class="chip">${secTag(it.s)} · Q${it.i+1}</span>`;
  const wasMissed = (view.type!=="section" && missed.has(keyOf(it)) && !done) ? `<span class="chip miss">Previously missed</span>` : "";
  $("#list").innerHTML = `<section class="${cls}">
    <div class="qh">
      <div class="qtop">
        <div class="qn">${modeLabel()} · Question ${view.pos+1} of ${n}${where}${wasMissed}</div>
        <button class="flag ${f?"on":""}" data-flag="1" title="Flag / unflag (F)">⚑ ${f?"Flagged":"Flag"}</button>
      </div>
      <p class="qt">${fmt(q.t)}</p>
    </div>
    <ul class="opts">${opts}</ul>
    ${actions}
    <div class="ans">
      <div class="verdict">${verdict}${L[q.a]} is the correct answer.</div>
      <h4>Justification</h4>
      <ul class="just">${just}</ul>
      <div class="meta">
        <div><strong>Domain</strong>${q.dom||PARTS[SECTIONS[it.s].part].domain}</div>
        <div><strong>Knowledge Statement</strong>${q.ksx||SECTIONS[it.s].ks}</div>
        <div><strong>Task Statement</strong>${q.k} – ${TASKS[q.k]}</div>
      </div>
    </div>
  </section>`;
  $("#btnPrev").disabled = view.pos===0;
  $("#btnNext").textContent = view.pos===n-1 ? "Finish ✓" : "Next →";
  $("#sCur").textContent = view.pos+1;
  renderDots(); stats();
}

function modeLabel(){
  return view.type==="section" ? secTag(view.sec)
       : view.type==="flagged" ? "⚑ Flagged review"
       : view.type==="retry"   ? "Retry"
       : "Missed review";
}

function renderDots(){
  $("#dots").innerHTML = view.items.map((it,idx)=>{
    const p = getPick(it); let c = "dot";
    if(p!==null) c += p===qOf(it).a ? " ok" : " no";
    if(idx===view.pos) c += " cur";
    if(flags.has(keyOf(it))) c += " fl";
    return `<button class="${c}" data-go="${idx}" title="${secTag(it.s)} · Q${it.i+1}">${view.type==="section"?it.i+1:idx+1}</button>`;
  }).join("");
}

function stats(){
  const items = view.items;
  const ans = items.filter(it=>getPick(it)!==null).length;
  const ok = items.filter(isRight).length;
  $("#sAns").textContent = ans; $("#sOk").textContent = ok;
  $("#pBar").style.width = (ans/items.length*100)+"%";
}

function renderPills(){
  const curSec = view.type==="section" ? view.sec : lastSec;
  const curPart = SECTIONS[curSec].part;
  const inSection = view.type==="section";
  $("#hTitle").textContent = inSection ? `Part ${curPart}: ${PARTS[curPart].title}`
                           : view.type==="flagged" ? "⚑ Flagged questions" : view.type==="missed" ? "✗ Missed questions" : "Retry – questions you missed";
  $("#parts").innerHTML = [1,2,3,4].map(p=>{
    const cnt = partSecs(p).reduce((n,i)=>n+SECTIONS[i].q.length,0);
    return `<button class="pcard ${inSection && p===curPart?"active":""}" data-part="${p}">
      <span class="pk"><span>Part ${p}</span><span class="cnt">${cnt}</span></span>
      <span class="pt">${PARTS[p].title}</span></button>`;
  }).join("");
  const tool = (type,label,count,hot)=>`<button class="tbtn ${view.type===type||(type==="missed"&&view.type==="retry")?"active":""}" data-mode="${type}">${label}<span class="n ${hot&&count?"hot":""}">${count}</span></button>`;
  $("#tools").innerHTML = tool("flagged","⚑ Flagged",flags.size,true) + tool("missed","✗ Missed",missed.size,false);
  $("#secLabel").textContent = curPart===4 ? "Practice exams · 45 questions each, randomly drawn from every section" : `Part ${curPart} sections`;
  $("#secs").innerHTML = partSecs(curPart).map((i,k)=>{
    const S = SECTIONS[i], a = inSection && view.sec===i, empty = S.q.length===0;
    return `<button class="scard ${a?"active":""} ${empty?"soon":""}" data-sec="${i}">
      <span class="no">${k+1}</span><span class="nm">${S.name.replace(/^\d+\.\s*/,"")}</span>
      <span class="bd">${empty?"Soon":S.q.length}</span></button>`;
  }).join("");
}

/* ---------- NAVIGATION ---------- */
let booted = false;
function alignTo(el){
  const bar = $(".bar").offsetHeight;
  const y = el.getBoundingClientRect().top + window.scrollY - bar - 8;
  window.scrollTo({top:Math.max(0,y), behavior:"auto"});
}
function showQuiz(){
  finished = false;
  $("#result").classList.remove("on"); $("#quiz").classList.remove("hidden");
  render(); if(booted) alignTo($("#dots"));
}
function enterSection(s){
  if(view.type==="section") secPos[view.sec] = view.pos;
  lastSec = s; partLast[SECTIONS[s].part] = s;
  view = { type:"section", sec:s, items:sectionItems(s), pos:secPos[s]||0 };
  showQuiz();
}
function enterPractice(type, items){
  if(view.type==="section") secPos[view.sec] = view.pos;
  practicePicks = {}; pend = {};
  view = { type, items, pos:0 };
  showQuiz();
}
function go(p){ view.pos = p; render(); alignTo($("#dots")); }
function next(){ if(!view.items.length) return; if(view.pos < view.items.length-1) go(view.pos+1); else showResult(); }
function prev(){ if(view.pos>0) go(view.pos-1); }

/* choose an option (not final until submitted) */
function selectOpt(n){
  if(!view.items.length) return;
  const it = view.items[view.pos];
  if(getPick(it)!==null) return;
  pend[keyOf(it)] = n;
  const y = window.scrollY; render(); window.scrollTo({top:y,behavior:"auto"});
}
/* lock in the selected option and show the justification */
function confirmAnswer(){
  if(!view.items.length) return;
  const it = view.items[view.pos];
  if(getPick(it)!==null) return;
  const n = pend[keyOf(it)]; if(n===undefined) return;
  delete pend[keyOf(it)];
  const y = window.scrollY; setPick(it,n); render(); window.scrollTo({top:y,behavior:"auto"});
  revealAnswer();
}
/* wrong answer -> clear it so the question can be answered again */
function retryQ(){
  if(!view.items.length) return;
  const it = view.items[view.pos], p = getPick(it);
  if(p===null || p===qOf(it).a) return;
  if(view.type==="section") secPicks[it.s][it.i] = null; else delete practicePicks[keyOf(it)];
  delete pend[keyOf(it)];
  render(); alignTo($("#dots"));
}
/* after submitting: scroll just enough to show the whole justification (never scrolls up) */
function revealAnswer(){
  const ans = document.querySelector("#list .ans"); if(!ans) return;
  const bar = $(".bar").offsetHeight, vh = window.innerHeight;
  const r = ans.getBoundingClientRect();
  const topLimit = bar + 8, bottomLimit = vh - 12;
  let delta = 0;
  if(r.height > bottomLimit - topLimit) delta = r.top - topLimit;
  else if(r.bottom > bottomLimit)        delta = r.bottom - bottomLimit;
  else if(r.top < topLimit)              delta = r.top - topLimit;
  if(delta > 0 || r.top < topLimit) window.scrollBy({top:delta, behavior:"smooth"});
}
function toggleFlag(){
  if(!view.items.length) return;
  const k = keyOf(view.items[view.pos]);
  flags.has(k) ? flags.delete(k) : flags.add(k);
  const y = window.scrollY; save(); render(); window.scrollTo({top:y,behavior:"auto"});
}
function restart(){
  pend = {};
  if(view.type==="section"){
    secPicks[view.sec] = SECTIONS[view.sec].q.map(()=>null); secPos[view.sec]=0;
    view.pos = 0; showQuiz();
  } else if(view.type==="retry"){
    enterPractice("retry", view.items.filter(it=>missed.has(keyOf(it))));
  } else enterPractice(view.type, poolFor(view.type));
}

/* ---------- RESULT ---------- */
function showResult(){
  finished = true;
  const n = view.items.length, ok = view.items.filter(isRight).length;
  const ans = view.items.filter(it=>getPick(it)!==null).length;
  const pct = Math.round(ok/n*100);
  $("#rTitle").textContent = view.type==="section" ? "Your score" : modeLabel()+" – your score";
  $("#rScore").textContent = `${ok} / ${n} (${pct}%)`;
  let msg = pct>=80 ? "Strong result — you're well prepared for this section."
          : pct>=60 ? "Decent start — practice the incorrect ones."
          :           "Keep going — practice the incorrect ones and try again.";
  if(ans<n) msg += ` (${n-ans} unanswered)`;
  if(view.type!=="section") msg = `${ok} answered correctly this round. ${missed.size} question(s) remain in your Missed list.`;
  $("#rMsg").textContent = msg;
  const need = view.items.filter(it=>!isRight(it));
  $("#btnReview").style.display = need.length ? "" : "none";
  $("#btnReview").textContent = view.type==="section" ? "Practice incorrect / unanswered" : "Practice the ones still wrong";
  const nextSec = view.type==="section" ? partSecs(SECTIONS[view.sec].part).find(i=>i>view.sec && SECTIONS[i].q.length) : undefined;
  view.nextSec = nextSec;
  $("#btnNextSec").style.display = nextSec !== undefined ? "" : "none";
  $("#btnBack").textContent = view.type==="section" ? "Back to questions" : "Back to "+secTag(lastSec);
  $("#quiz").classList.add("hidden"); $("#result").classList.add("on");
  alignTo($("#result"));
}

/* ---------- EVENTS ---------- */
$("#list").addEventListener("click", e=>{
  if(e.target.closest("[data-flag]")) return toggleFlag();
  if(e.target.closest("[data-confirm]")) return confirmAnswer();
  if(e.target.closest("[data-retry]")) return retryQ();
  const opt = e.target.closest(".opt"); if(opt) selectOpt(+opt.dataset.o);
});
$("#dots").addEventListener("click", e=>{
  const d = e.target.closest("[data-go]"); if(d) go(+d.dataset.go);
});
$("#secs").addEventListener("click", e=>{
  const b = e.target.closest("button"); if(b && b.dataset.sec!==undefined) enterSection(+b.dataset.sec);
});
$("#tools").addEventListener("click", e=>{
  const b = e.target.closest("button"); if(b && b.dataset.mode) enterPractice(b.dataset.mode, poolFor(b.dataset.mode));
});
$("#parts").addEventListener("click", e=>{
  const b = e.target.closest("button"); if(!b || !b.dataset.part) return;
  const p = +b.dataset.part;
  enterSection(partLast[p]!==undefined ? partLast[p] : (partSecs(p).find(i=>SECTIONS[i].q.length) ?? partSecs(p)[0]));
});
$("#btnNext").addEventListener("click", next);
$("#btnPrev").addEventListener("click", prev);
$("#btnReset").addEventListener("click", restart);
$("#btnRestart").addEventListener("click", restart);
$("#btnNextSec").addEventListener("click", ()=>{ if(view.nextSec!==undefined) enterSection(view.nextSec); });
$("#btnBack").addEventListener("click", ()=>{
  if(view.type==="section"){ view.pos=0; showQuiz(); } else enterSection(lastSec);
});
$("#btnReview").addEventListener("click", ()=>{
  enterPractice("retry", view.items.filter(it=>!isRight(it)));
});
/* keyboard: A–D select · Enter submit (or next once answered) · R try again · F flag · ← → move */
document.addEventListener("keydown", e=>{
  if(finished || e.ctrlKey || e.metaKey || e.altKey) return;
  const k = e.key.toUpperCase();
  if(e.key==="Enter"){
    e.preventDefault();
    if(!view.items.length) return;
    getPick(view.items[view.pos])===null ? confirmAnswer() : next();
  }
  else if(k==="F") toggleFlag();
  else if(k==="R") retryQ();
  else if(k.length===1 && "ABCD".includes(k)) selectOpt("ABCD".indexOf(k));
  else if(e.key==="ArrowRight") next();
  else if(e.key==="ArrowLeft") prev();
});

const _sec = parseInt(new URLSearchParams(location.search).get("sec"),10);
const START_SEC = SECTIONS.findIndex(S => S.part === 1);   /* Part 1 · Section 1 */
enterSection(Number.isInteger(_sec) && SECTIONS[_sec] ? _sec : START_SEC);
booted = true;
</script>
</body>
